/* ================= IndexedDB media ================= */
const Media = (() => {
  let dbp = null;
  let dbName = 'yann_media';
  const openAt = (name) => new Promise((res, rej) => {
    const r = indexedDB.open(name, 1);
    const to = setTimeout(() => rej(new Error('idb-timeout')), 5000);
    r.onupgradeneeded = () => { if (!r.result.objectStoreNames.contains('kv')) r.result.createObjectStore('kv'); };
    r.onsuccess = () => {
      clearTimeout(to);
      r.result.onversionchange = () => r.result.close();
      res(r.result);
    };
    r.onerror = () => { clearTimeout(to); rej(r.error); };
  });
  const open = () => dbp || (dbp = openAt(dbName).catch(() => {
    dbName = 'yann_media_fb';
    return openAt(dbName);
  }).catch(err => { dbp = null; throw err; }));
  const tx = async (mode, fn) => {
    const db = await open();
    return new Promise((res, rej) => {
      const t = db.transaction('kv', mode);
      const out = fn(t.objectStore('kv'));
      t.oncomplete = () => res(out && out.result !== undefined ? out.result : undefined);
      t.onerror = () => rej(t.error);
      t.onabort = () => rej(t.error);
    });
  };
  return {
    set: (k, v) => tx('readwrite', st => st.put(v, k)),
    get: (k) => tx('readonly', st => st.get(k)),
    del: (k) => tx('readwrite', st => st.delete(k)),
    keys: async () => {
      const db = await open();
      return new Promise((res, rej) => {
        const t = db.transaction('kv', 'readonly');
        const q = t.objectStore('kv').getAllKeys();
        q.onsuccess = () => res(q.result || []);
        q.onerror = () => rej(q.error);
      });
    },
    all: async () => {
      const keys = await Media.keys();
      const out = {};
      for (const k of keys) out[k] = await Media.get(k);
      return out;
    },
    clear: () => tx('readwrite', st => st.clear())
  };
})();

let MEDIA = {};
/* 旧 IndexedDB 迁移：新库为空时，把 duibai_media 里的媒体搬到 yann_media */
const idbTimeout = (p, ms) => Promise.race([p, new Promise(r => setTimeout(() => r(null), ms))]);
function openLegacyDb(name) {
  return new Promise((res, rej) => {
    let created = false;
    const r = indexedDB.open(name);
    r.onupgradeneeded = () => { created = true; };
    r.onsuccess = () => res({ db: r.result, created });
    r.onerror = () => rej(r.error);
  });
}
async function migrateMediaDb() {
  try {
    const have = await Media.keys();
    if (have.length) return;
    let legacy = null;
    for (const name of ['duibai_media', 'duibai_media_fb']) {
      try {
        /* 旧库可能被浏览器卡住（一直不触发事件），最多等 1.2 秒就跳 */
        const r = await idbTimeout(openLegacyDb(name), 1200);
        if (!r) continue;
        if (r.created || !r.db.objectStoreNames.contains('kv')) {
          r.db.close();
          if (r.created) indexedDB.deleteDatabase(name);
          continue;
        }
        legacy = r.db;
        break;
      } catch (e) { legacy = null; }
    }
    if (!legacy) return;
    const data = await idbTimeout(new Promise((res, rej) => {
      const t = legacy.transaction('kv', 'readonly');
      const ks = t.objectStore('kv').getAllKeys();
      const vs = t.objectStore('kv').getAll();
      t.oncomplete = () => res({ keys: ks.result || [], vals: vs.result || [] });
      t.onerror = () => rej(t.error);
    }), 4000);
    if (!data) { legacy.close(); return; }
    for (let i = 0; i < data.keys.length; i++) await Media.set(data.keys[i], data.vals[i]);
    legacy.close();
  } catch (e) { /* 迁移失败不影响使用 */ }
}
const avatarUrl = key => (key && MEDIA[key]) ? MEDIA[key] : '';
const bgUrl = () => (S.settings.bgKey && MEDIA[S.settings.bgKey]) ? MEDIA[S.settings.bgKey] : '';

async function putMedia(key, dataUrl) {
  MEDIA[key] = dataUrl;
  try { await Media.set(key, dataUrl); } catch (e) { console.warn(e); }
}

function readFileAsDataURL(file) {
  return new Promise((res, rej) => {
    const fr = new FileReader();
    fr.onload = () => res(fr.result);
    fr.onerror = () => rej(fr.error);
    fr.readAsDataURL(file);
  });
}

/* compress an image file to a square-ish JPEG dataURL */
async function fileToImage(file, max = 720, square = false, type = 'image/jpeg', quality = 0.86) {
  const raw = await readFileAsDataURL(file);
  if (!/^image\//.test(file.type)) return raw;
  try {
    const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = raw; });
    let w = img.width, h = img.height;
    if (square) { const s = Math.min(w, h); w = s; h = s; }
    const scale = Math.min(1, max / Math.max(w, h));
    const cv = document.createElement('canvas');
    cv.width = Math.round(w * scale); cv.height = Math.round(h * scale);
    const cx = cv.getContext('2d');
    if (square) cx.drawImage(img, (img.width - w) / 2, (img.height - h) / 2, w, h, 0, 0, cv.width, cv.height);
    else cx.drawImage(img, 0, 0, cv.width, cv.height);
    return cv.toDataURL(type, quality);
  } catch (e) { return raw; }
}

function openSheet(html, onMount, mode) {
  const host = $('#sheetHost');
  host.innerHTML = `<div class="scrim"></div><div class="sheet"><div class="grab"></div>${html}</div>`;
  host.classList.add('on');
  const sheet = host.querySelector('.sheet');
  /* 行对齐：纯文字弹窗居中；带图标/右侧说明的弹窗左对齐并统一文字列 */
  const rows = [...sheet.querySelectorAll('.m-row')];
  if (rows.length) {
    const hasIcon = rows.some(r => r.querySelector('svg,img'));
    const hasMeta = rows.some(r => r.querySelector('.m-muted,.m-tick,.val'));
    sheet.classList.add(hasIcon || hasMeta ? 'rows-rich' : 'rows-plain');
    if (hasIcon) {
      sheet.classList.add('rows-icon');
      /* 没图标的行补出图标宽度，让文字和带图标的行落在同一列 */
      rows.forEach(r => { if (!r.querySelector('svg,img')) r.classList.add('m-row-noicon'); });
    }
  }
  const scrim = host.querySelector('.scrim');
  const center = mode === 'center';
  if (center) sheet.classList.add('center');
  requestAnimationFrame(() => {
    scrim.style.opacity = 1;
    if (center) { sheet.style.transform = 'translate(-50%,50%) scale(1)'; sheet.style.opacity = '1'; }
    else sheet.style.transform = 'translateY(0)';
  });
  scrim.addEventListener('click', closeSheet);
  if (onMount) onMount(sheet);
  return sheet;
}

function closeSheet() {
  const host = $('#sheetHost');
  const sheet = host.querySelector('.sheet');
  const scrim = host.querySelector('.scrim');
  if (!sheet) return;
  if (sheet.classList.contains('center')) {
    sheet.style.transform = 'translate(-50%,50%) scale(.94)';
    sheet.style.opacity = '0';
  } else {
    sheet.style.transform = 'translateY(100%)';
  }
  scrim.style.opacity = 0;
  host.classList.remove('on');
  setTimeout(() => { if (!host.classList.contains('on')) host.innerHTML = ''; }, 340);
}

let CUR = null;
const PAGE_RENDER = {};
let PAGE_STACK = [];

function go(id, isBack) {
  if (CUR === id) return;
  closeMsgMenu();
  if (typeof closePanels === 'function') closePanels();
  if (typeof clearQuote === 'function') clearQuote();
  const prev = CUR ? $('#' + CUR) : null;
  if (prev) prev.classList.remove('open');
  /* 页面栈：返回时直接回到上一个打开过的页 */
  if (!isBack) {
    if (id && CUR) PAGE_STACK.push(CUR);
    if (!id) PAGE_STACK.length = 0;
  }
  CUR = id;
  if (!id) {
    // 关掉全屏页：恢复底栏高亮到当前面板
    document.querySelectorAll('#tabbar .tab').forEach(b => b.classList.toggle('on', b.dataset.tab === TAB));
    updateTabDots();
    return;
  }
  const page = $('#' + id);
  if (PAGE_RENDER[id]) PAGE_RENDER[id]();
  updateTabDots();
  if (page) page.classList.add('open');
}

/* 返回：回上一个打开过的页面；没有就回底栏面板 */
function goBack() {
  const was = CUR;
  const prev = PAGE_STACK.pop();
  if (prev && document.getElementById(prev)) { go(prev, true); return; }
  if (was === 'peer') { backToProfile(); return; }
  go(null);
  if (!document.querySelector('.panel.active')) setTab('profile');
  renderHome();
}

  const now = Date.now();
  const days = Math.ceil((target - now) / 86400000);
  const from = c.from ? new Date(c.from + 'T00:00:00').getTime() : now;
  const total = Math.max(86400000, target - from);
  const ratio = Math.max(0, Math.min(1, (now - from) / total));
  return { days, name: c.name || '倒数日', date: c.date, ratio };
}

const IC_COMMENT = '<svg viewBox="0 0 24 24"><path d="M20 12.5c0 3.9-3.6 7-8 7-1 0-2-.2-2.9-.5L4.5 20l1.2-3.4A6.7 6.7 0 0 1 4 12.5c0-3.9 3.6-7 8-7s8 3.1 8 7z"/></svg>';
const IC_HEART = '<svg viewBox="0 0 24 24"><path d="M12 20s-7.2-4.4-7.2-9.2A4.2 4.2 0 0 1 12 7.9a4.2 4.2 0 0 1 7.2 2.9C19.2 15.6 12 20 12 20z"/></svg>';
const IC_SAVE = '<svg viewBox="0 0 24 24"><path d="M6.5 4h11a1 1 0 0 1 1 1v15l-6.5-4.2L5.5 20V5a1 1 0 0 1 1-1z"/></svg>';
const IC_LIST = '<svg viewBox="0 0 24 24"><path d="M4.5 6.5h15M4.5 12h10M4.5 17.5h13"/></svg>';
const IC_CHEV = '<svg class="chev" viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg>';
const IC_REPOST = '<svg viewBox="0 0 24 24"><path d="M4 9.5A3.5 3.5 0 0 1 7.5 6H17"/><path d="M14.5 3.5L17.5 6l-3 2.5"/><path d="M20 14.5A3.5 3.5 0 0 1 16.5 18H7"/><path d="M9.5 20.5L6.5 18l3-2.5"/></svg>';
const IC_ACC = '<svg viewBox="0 0 24 24"><circle cx="12" cy="8.6" r="3.5"/><path d="M5.6 19.4c.8-3.5 3.4-5.4 6.4-5.4s5.6 1.9 6.4 5.4"/></svg>';

/* @ 存的是固定标记（对方 / 我），屏幕上才换成当前昵称：改昵称后历史消息里的 @ 也跟着变 */
const AT_PEER = '\u0001P\u0001';
const AT_ME = '\u0001M\u0001';
function encodeMentions(text) {
  let t = String(text || '');
  const pn = atName(S.peer), mn = atName(S.me);
  if (pn) t = t.split('@' + pn).join(AT_PEER);
  if (mn) t = t.split('@' + mn).join(AT_ME);
  return t;
}
/* 只有从「@」面板里选的人才会被认成提及 */
let pendingMentions = [];
function encodePending(text) {
  let t = String(text || '');
  pendingMentions.forEach(m => {
    const token = '@' + m.name;
    const i = t.indexOf(token);
    if (i < 0) return;
    t = t.slice(0, i) + (m.kind === 'peer' ? AT_PEER : AT_ME) + t.slice(i + token.length);
  });
  pendingMentions = [];
  return t;
}
/* 进入编辑时把标记还原成 @昵称，并把它们记成“待转换” */
function decodeForEdit(raw) {
  const s = String(raw || '');
  let out = '', i = 0;
  while (i < s.length) {
    if (s.startsWith(AT_PEER, i)) {
      const nm = atName(S.peer);
      out += '@' + nm; pendingMentions.push({ kind: 'peer', name: nm }); i += AT_PEER.length;
    } else if (s.startsWith(AT_ME, i)) {
      const nm = atName(S.me);
      out += '@' + nm; pendingMentions.push({ kind: 'me', name: nm }); i += AT_ME.length;
    } else {
      out += s[i++];
    }
  }
  return out;
}

function decodeMentions(text) {
  return String(text || '')
    .split(AT_PEER).join('@' + atName(S.peer))
    .split(AT_ME).join('@' + atName(S.me));
}

/* 渲染：只把内部标记变成蓝色，手打的 @ 一律普通文字 */
const linkifyAt = s => esc(s)
  .split(AT_PEER).join(`<span class="at">@${esc(atName(S.peer))}</span>`)
  .split(AT_ME).join(`<span class="at">@${esc(atName(S.me))}</span>`);

/* 回复区：默认只显示前两条，点「查看全部」原地展开 */
const expandedCmt = new Set();

function postCard(p) {
  const mine = p.by !== 'peer';
  const meAv = avatarUrl(mine ? S.me.avatar : S.peer.avatar);
  const who = mine ? S.me : S.peer;
  const whoId = (mine ? (S.me.id || '') : peerHandle()).trim();
  const atSpan = id => (id ? `<i class="acc-sep"></i>${esc(id)} · ` : ''); /* 账号前用竖线分隔 */
  const imgs = (p.images || []).filter(k => MEDIA[k]);
  const cn = (p.comments || []).length;
  const likeN = (p.likes || 0) + (p.liked ? 1 : 0);
  const saveN = (p.saved ? 1 : 0) + (p.peerSaved ? 1 : 0);
  const resolveSrc = (id, d) => {
    const s = (S.posts || []).find(x => x.id === id);
    if (!s || (d || 0) > 3) return s;
    if (!s.text && !(s.images || []).length && s.repostOf) return resolveSrc(s.repostOf, (d || 0) + 1);
    return s;
  };
  const src = p.repostOf ? resolveSrc(p.repostOf, 0) : null;
  const repost = p.repostOf ? `<div class="repost">${src ? `
      <div class="repost-h"><b>${esc(src.by === 'peer' ? peerLabel() : S.me.name)}</b><span>${atSpan(src.by === 'peer' ? peerHandle() : (S.me.id || ''))}${postTime(src.ts)}</span></div>
      ${src.text ? `<div class="repost-t">${linkifyAt(src.text)}</div>` : ''}
      ${(src.images || []).filter(k => MEDIA[k]).slice(0, 1).map(k => `<img class="repost-img" src="${MEDIA[k]}" alt="">`).join('')}` : `<div class="repost-t" style="color:#9A9AA4">原动态已删除</div>`}</div>` : '';
  return `<div class="post${p.repostOf ? ' rp-card' : ''}">
    <div class="post-head">
      <div class="post-av"${mine ? '' : ` data-peek="peer" title="查看主页"`}${meAv ? ` style="background-image:url('${meAv}')"` : ''}>${meAv ? '' : esc(((whoName(who) || '·').trim().slice(0, 1)) || '·')}</div>
      <div class="post-by"><b>${esc(whoName(who))}</b>${p.repostOf ? `<span class="rp-pill">${IC_REPOST}转发</span>` : ''}<span>${atSpan(whoId)}${postTime(p.ts)}${p.editedAt && p.editedAt > (p.ts || 0) ? `<em class="ed-t">· 编辑于 ${postTime(p.editedAt)}</em>` : ''}</span></div>
      ${mine ? `<div class="post-menu-wrap">
        <button class="post-dots" data-dots="${p.id}" aria-label="更多"><svg viewBox="0 0 24 24"><circle cx="6" cy="12" r="1.7"/><circle cx="12" cy="12" r="1.7"/><circle cx="18" cy="12" r="1.7"/></svg></button>
        <div class="post-menu" data-menu="${p.id}">
          <i data-edit="${p.id}"><svg viewBox="0 0 24 24"><path d="M4 20h4l10-10-4-4L4 16z"/><path d="M13.5 6.5l4 4"/></svg>编辑</i>
          <i class="del" data-del="${p.id}"><svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M7 7l1 12h8l1-12"/></svg>删除</i>
        </div>
      </div>` : ''}
    </div>
    ${p.text ? `<div class="post-txt">${linkifyAt(p.text)}</div>` : ''}
    ${repost}
    ${imgs.length ? `<div class="post-imgs${imgs.length === 1 ? ' single' : ''}">${imgs.map(k => `<img src="${MEDIA[k]}" alt="">`).join('')}</div>` : ''}
    <div class="post-acts">
      <button class="act${p.liked ? ' on' : ''}" data-like="${p.id}">${IC_HEART}<span>${likeN || ''}</span></button>
      <button class="act${cn ? ' on' : ''}" data-cmt="${p.id}">${IC_COMMENT}<span>${cn || ''}</span></button>
      ${mine ? '' : `<button class="act" data-repost="${p.id}">${IC_REPOST}<span>转发</span></button>`}
      <button class="act${p.saved ? ' on' : ''}" data-save="${p.id}">${IC_SAVE}<span>${p.saved ? '已收藏' : '收藏'}${saveN ? ' ' + saveN : ''}</span></button>
    </div>
    ${(p.comments || []).length ? (() => {
      const cs = p.comments;
      const open = expandedCmt.has(p.id);
      const shown = open ? cs : cs.slice(0, 2);
      const rows = shown.map(c => {
        const who = c.by === 'peer' ? S.peer : S.me;
        const wav = avatarUrl(who.avatar);
        const parent = c.replyTo ? cs.find(x => x.id === c.replyTo) : null;
        const qText = parent ? parent.text : (c.quoteText || '');
        const qPeer = parent ? (parent.by === 'peer') : (c.quoteBy === 'peer');
        const qName = qPeer ? peerLabel() : S.me.name;
        return `
        <div class="rep-row" data-rcmt="${c.id}" data-rpost="${p.id}">
          <div class="rep-av${c.by === 'peer' ? ' rep-av-tap' : ''}"${c.by === 'peer' ? ' data-repav="1"' : ''}${wav ? ` style="background-image:url('${wav}')"` : ''}>${wav ? '' : esc(((whoName(who) || '·').trim().slice(0, 1)) || '·')}</div>
          <div class="rep-main">
            <div class="rep-head"><b>${esc(whoName(who))}</b><span>${atSpan(c.by === 'peer' ? peerHandle() : (who.id || ''))}${postTime(c.ts)}</span></div>
            ${qText ? `<div class="rep-quote"><b>${esc(qName)}</b>${esc(qText)}</div>` : ''}
            <div class="rep-text">${linkifyAt(c.text)}</div>
          </div>
        </div>`;
      }).join('');
      const more = cs.length > 2
        ? `<button class="rep-more" data-repmore="${p.id}">${open ? '收起回复' : `查看全部 ${cs.length} 条回复`}</button>`
        : '';
      return `<div class="rep-box"><div class="rep-rail"></div>${rows}${more}</div>`;
    })() : ''}
  </div>`;
}

function updateComposeCount() {

/* 输入区高亮层：从面板选中的 @ 立刻变蓝，手打的不变 */
function renderComposeHL() {
  const ta = $('#composeText'), hl = $('#composeHL');
  if (!ta || !hl) return;
  const v = ta.value;
  let html = linkifyAt(v);
  pendingMentions.forEach(m => {
    const token = '@' + esc(m.name);
    const i = html.indexOf(token);
    if (i < 0) return;
    html = html.slice(0, i) + `<span class="at">${token}</span>` + html.slice(i + token.length);
  });
  hl.innerHTML = v ? html + (v.endsWith('\n') ? '\u200b' : '') : '';
  hl.scrollTop = ta.scrollTop;
}

/* 退格/删除：遇到 @账号 一次删掉整段 */
function bindComposeAtoms() {
  const ta = $('#composeText');
  if (!ta || ta.dataset.atoms) return;
  ta.dataset.atoms = '1';
  ta.addEventListener('keydown', e => {
    if (e.key !== 'Backspace' && e.key !== 'Delete') return;
    const s = ta.selectionStart, en = ta.selectionEnd;
    if (s !== en) return;
    const v = ta.value;
    if (e.key === 'Backspace') {
      const m = v.slice(0, s).match(/@[\w\u4e00-\u9fa5.\-]+$/);
      if (!m) return;
      e.preventDefault();
      const cut = s - m[0].length;
      ta.value = v.slice(0, cut) + v.slice(s);
      ta.selectionStart = ta.selectionEnd = cut;
    } else {
      const m = v.slice(en).match(/^@[\w\u4e00-\u9fa5.\-]+/);
      if (!m) return;
      e.preventDefault();
      ta.value = v.slice(0, en) + v.slice(en + m[0].length);
      ta.selectionStart = ta.selectionEnd = en;
    }
    updateComposeCount();
  });
  ta.addEventListener('scroll', () => {
    const hl = $('#composeHL');
    if (hl) hl.scrollTop = ta.scrollTop;
  });
}

async function publishCompose() {
  const t = (($('#composeText') || {}).value || '').trim();
  if (!t && !composeImgs.length && !composeRepost) { toast('写点什么再发'); return; }
  const keys = [];
  for (const dataUrl of composeImgs) {
    const k = 'postimg:' + uid();
    await putMedia(k, dataUrl);
    keys.push(k);
  }
  S.posts = S.posts || [];
  /* 编辑已有动态：覆盖内容，不新建、不动时间 */
  if (composeEdit) {
    const p = S.posts.find(x => x.id === composeEdit);
    if (p) {
      p.text = encodePending(t);
      p.images = keys;
      p.editedAt = Date.now();
    }
    composeEdit = null;
    save();
    go(null); setTab('profile'); renderProfilePanel();
    toast('已保存');
    return;
  }
  const post = { id: uid(), text: encodePending(t), ts: Date.now(), images: keys, likes: 0, liked: false, saved: false, comments: [] };
  if (composeRepost) post.repostOf = composeRepost;
  composeRepost = null;
  S.posts.push(post);
  save();
  go(null);
  setTab('profile');
  renderProfilePanel();
  toast('已发布');
  reactToPost(post.id);
  armRepost(post.id);
}

/* 对方转发我的动态 */
function armRepost(postId) {
  const st = S.settings;
  if (!st.peerRepostOn) return;
  const lo = Math.min(st.delayMin, st.delayMax), hi = Math.max(st.delayMin, st.delayMax);
  const wait = Math.min(60000, Math.max(6000, rand(lo, hi) * 1000 + 5000));
  setTimeout(() => {
    if (!S.settings.peerRepostOn) return;
    if (Math.random() * 100 >= (S.settings.peerRepostRate || 0)) return;
    peerRepost(postId);
  }, wait);
}

function peerRepost(postId) {
  const src = (S.posts || []).find(p => p.id === postId);
  if (!src) return;
  const cards = pool();
  let text = '';
  if (cards.length && Math.random() * 100 < (S.settings.peerRepostTextRate || 0)) {
    const clamp = (v, d) => Math.max(1, Math.min(5, Math.round(Number(v) || d)));
    const kmin = clamp(S.settings.peerRepostTextMin, 1);
    const kmax = Math.max(kmin, clamp(S.settings.peerRepostTextMax, kmin));
    const k = randInt(kmin, kmax);
    text = sampleCards(cards, k).map(c => c.text.replace(/\s+$/, '')).join(' ');
  }
  S.posts = S.posts || [];
  S.posts.push({
    id: uid(), text, ts: Date.now(), images: [], likes: 0, liked: false, saved: false,
    comments: [], by: 'peer', repostOf: postId
  });
  save();
  if (CUR === 'peer') renderPeerPanel();
  if (TAB === 'profile') renderProfilePanel();
  else S.settings.postDot = true;
  updateTabDots();
}

let peerPostTimer = null;

function armPeerPost() {
  clearTimeout(peerPostTimer);
  const st = S.settings;
  if (!st.peerPostOn) return;
  const lo = Math.min(st.peerPostMin, st.peerPostMax), hi = Math.max(st.peerPostMin, st.peerPostMax);
  const wait = Math.max(60, rand(lo, hi) * 60) * 1000;
  peerPostTimer = setTimeout(() => {
    if (!S.settings.peerPostOn) return;
    if (Math.random() * 100 < (S.settings.peerPostRate || 0)) peerMakePost();
    armPeerPost();
  }, wait);
}

function peerMakePost() {
  const cards = pool();
  if (!cards.length) return;
  const cMin = Math.max(1, Math.min(6, Math.round(Number(S.settings.postCardsMin) || 1)));
  const cMax = Math.max(cMin, Math.min(6, Math.round(Number(S.settings.postCardsMax) || cMin)));
  const n = randInt(cMin, cMax);
  const sep = ' ';
  let text = sampleCards(cards, n).map(c => c.text.replace(/\s+$/, '')).join(sep);
  if (S.settings.peerMentionOn && Math.random() * 100 < (S.settings.peerMentionRate || 0)) {
    text += ' ' + AT_ME;
  }
  S.posts = S.posts || [];
  S.posts.push({ id: uid(), text, ts: Date.now(), images: [], likes: 0, liked: false, saved: false, comments: [], by: 'peer' });
  if (CUR === 'peer') renderPeerPanel();
  if (TAB === 'profile') renderProfilePanel();
  else S.settings.postDot = true;
  save();
  updateTabDots();
}

function reactToPost(postId) {
  const st = S.settings;
  const lo = Math.min(st.delayMin, st.delayMax), hi = Math.max(st.delayMin, st.delayMax);
  const wait = Math.min(20000, Math.max(2500, rand(lo, hi) * 1000 + 1500));
  setTimeout(() => {
    const p = (S.posts || []).find(x => x.id === postId);
    if (!p) return;
    let changed = false;
    if (Math.random() * 100 < (st.postLikeRate || 0)) {
      p.likes = (p.likes || 0) + 1;
      p.peerLikedAt = Date.now();
      changed = true;
    }
    if (Math.random() * 100 < (st.postCommentRate || 0)) {
      const cards = pool();
      const text = cards.length ? pick(cards).text : '看到了。';
      p.comments = p.comments || [];
      p.comments.push({ id: uid(), text, ts: Date.now(), by: 'peer' });
      changed = true;
      if (TAB !== 'profile') {
        S.settings.postDot = true;
        updateTabDots();
      }
    }
    if (p.by !== 'peer' && !p.peerSaved && Math.random() * 100 < (st.postSaveRate || 0)) {
      p.peerSaved = true;
      p.peerSavedAt = Date.now();
      changed = true;
    }
    if (changed) {
      save();
      if (TAB === 'profile') renderProfilePanel();
    }
  }, wait);
}

/* 他回复我对动态的评论 */
function armCommentReply(postId) {
  const st = S.settings;
  if (Math.random() * 100 >= (st.postReplyRate || 0)) return;
  const lo = Math.min(st.postReplyDelayMin, st.postReplyDelayMax);
  const hi = Math.max(st.postReplyDelayMin, st.postReplyDelayMax);
  const wait = Math.max(1000, rand(lo, hi) * 1000);
  setTimeout(() => {
    const p = (S.posts || []).find(x => x.id === postId);
    if (!p) return;
    const cards = pool();
    if (!cards.length) return;
    const clamp = (v, d, max) => Math.max(1, Math.min(max, Math.round(Number(v) || d)));
    const cmin = clamp(st.postReplyCountMin, 1, 5), cmax = Math.max(cmin, clamp(st.postReplyCountMax, cmin, 5));
    const kmin = clamp(st.postReplyCardsMin, 1, 5), kmax = Math.max(kmin, clamp(st.postReplyCardsMax, kmin, 5));
    const n = randInt(cmin, cmax);
    p.comments = p.comments || [];
    for (let i = 0; i < n; i++) {
      const k = randInt(kmin, kmax);
      const text = sampleCards(cards, k).map(c => c.text.replace(/\s+$/, '')).join(' ');
      p.comments.push({ id: uid(), text, ts: Date.now() + i, by: 'peer' });
    }
    save();
    if (CUR === 'peer') renderPeerPanel();
    if (TAB === 'profile') renderProfilePanel();
    else if (CUR !== 'peer') { S.settings.postDot = true; updateTabDots(); }
  }, wait);
}

/* 两个面板之间直接切换：先关掉过渡，换完再恢复，不做上升/下降动画 */
function withNoTransition(fn) {
  const els = [$('#stickerPanel'), $('#actionPanel')].filter(Boolean);
  els.forEach(e => e.classList.add('no-anim'));
  fn();
  els.forEach(e => void e.offsetHeight); /* 强制一次重排，让新尺寸立即生效 */
  requestAnimationFrame(() => els.forEach(e => e.classList.remove('no-anim')));
}

function renderSearchResults(q) {
  const box = $('#searchResults');
  if (!box) return;
  const raw = (q || '').trim();
  const kw = raw.toLowerCase();
  if (!kw) {
    box.innerHTML = `<div class="empty-hint">输入关键词搜索聊天记录</div>`;
    return;
  }
  const hits = S.messages.filter(m => m.role !== 'system' && !m.recalled && (m.text || '').toLowerCase().includes(kw));
  if (!hits.length) {
    box.innerHTML = `<div class="empty-hint">没有找到「${esc(raw)}」</div>`;
    return;
  }
  box.innerHTML = hits.slice().reverse().map(m => {
    const mine = m.role === 'me';
    const name = mine ? S.me.name : peerLabel();
    const idx = m.text.toLowerCase().indexOf(kw);
    const pre = esc(m.text.slice(Math.max(0, idx - 14), idx));
    const hit = esc(m.text.slice(idx, idx + raw.length));
    const post = esc(m.text.slice(idx + raw.length, idx + raw.length + 34));
    const d = new Date(m.ts);
    const date = `${d.getMonth() + 1}/${d.getDate()} ${hhmm(m.ts)}`;
    const person = mine ? S.me : S.peer;
    const av = avatarUrl(person.avatar);
    const ini = esc(((name || '·').trim().slice(0, 1)) || '·');
    return `<div class="row-item" data-mid="${m.id}">
      <div class="row-av"${av ? ` style="background-image:url('${av}')"` : ''}>${av ? '' : ini}</div>
      <div class="row-main">
        <div class="row-top"><span class="row-name">${esc(name)}</span><span class="row-time">${date}</span></div>
        <div class="row-bot"><span class="row-sub">${pre}<mark>${hit}</mark>${post}</span></div>
      </div>
    </div>`;
  }).join('');
}

function jumpToMessage(id) {

    row.scrollIntoView({ block: 'center' });
    row.classList.add('jump');
    setTimeout(() => row.classList.remove('jump'), 1800);
  }, 320);
}

function bindShell() {
  $('#tabbar').addEventListener('click', e => {
    const b = e.target.closest('[data-tab]');
    if (b) setTab(b.dataset.tab);
  });
  const search = $('#chatsSearch');
  if (search) search.addEventListener('click', () => go('search'));
  const cl = $('#chatsList');
  if (cl) cl.addEventListener('click', e => {
    if (e.target.closest('[data-open="chat"]')) go('chat');
  });
  $('#peerBody').addEventListener('click', e => {
    const act = e.target.closest('[data-act]');
    if (act && act.dataset.act === 'edit-card') { openProfileEditor('peer'); return; }
    const col = e.target.closest('[data-ptab]');
    if (col) {
      const k = col.dataset.ptab;
      if (col.dataset.pkind === 'peer') { peerTab = k; renderPeerPanel(); }
      else { profileTab = k; renderProfilePanel(); }
      return;
    }
    const peek = e.target.closest('[data-peek]');
    if (peek) { peekProfile(peek.dataset.peek); return; }
    const likeP = e.target.closest('[data-like]');
    if (likeP) {
      const p = (S.posts || []).find(x => x.id === likeP.dataset.like);
      if (p) { p.liked = !p.liked; p.likedAt = p.liked ? Date.now() : null; save(); renderPeerPanel(); }
      return;
    }
    const sv = e.target.closest('[data-save]');
    if (sv) {
      const p = (S.posts || []).find(x => x.id === sv.dataset.save);
      if (p) { p.saved = !p.saved; save(); renderPeerPanel(); }
      return;
    }
    const rp = e.target.closest('[data-repost]');
    if (rp) { repostPost(rp.dataset.repost); return; }
    const cm = e.target.closest('[data-cmt]');
    if (cm) { openComments(cm.dataset.cmt); return; }
  });
  $('#postFab').addEventListener('click', () => { composeRepost = null; composeEdit = null; go('compose'); });
  $('#composePublish').addEventListener('click', publishCompose);
  $('#composeAddImg').addEventListener('click', addComposeImg);
  $('#composeText').addEventListener('input', updateComposeCount);
  bindComposeAtoms();
  $('#composeAt').addEventListener('click', () => openMentionSheet());
  $('#composeImgs').addEventListener('click', e => {
    const rm = e.target.closest('[data-rmimg]');
    if (!rm) return;
    composeImgs.splice(+rm.dataset.rmimg, 1);
    renderComposeImgs();
  });
  $('#profileBody').addEventListener('click', async e => {
    const peek = e.target.closest('[data-peek]');
    if (peek) { peekProfile(peek.dataset.peek); return; }
    const col = e.target.closest('[data-ptab]');
    if (col) {
      const k = col.dataset.ptab;
      if (col.dataset.pkind === 'peer') { peerTab = k; renderPeerPanel(); }
      else { profileTab = k; renderProfilePanel(); }
      return;
    }
    const act = e.target.closest('[data-act]');
    if (act && act.dataset.act === 'edit-card') { openProfileEditor(act.dataset.kind); return; }
    /* ⋯ 菜单：展开 / 收起 */
    const dots = e.target.closest('[data-dots]');
    if (dots) {
      const menu = document.querySelector(`#profileBody .post-menu[data-menu="${dots.dataset.dots}"]`);
      const wasOn = menu && menu.classList.contains('on');
      document.querySelectorAll('#profileBody .post-menu.on').forEach(m => m.classList.remove('on'));
      if (menu && !wasOn) menu.classList.add('on');
      return;
    }
    document.querySelectorAll('#profileBody .post-menu.on').forEach(m => m.classList.remove('on'));
    const ed = e.target.closest('[data-edit]');
    if (ed) { openEditPost(ed.dataset.edit); return; }
    const del = e.target.closest('[data-del]');
    if (del) {
      if (!await uiConfirm('删除这条动态？', '', '删除', true)) return;
      S.posts = (S.posts || []).filter(p => p.id !== del.dataset.del);
      save(); renderProfilePanel();
      toast('已删除');
      return;
    }
    const like = e.target.closest('[data-like]');
    if (like) {
      const p = (S.posts || []).find(x => x.id === like.dataset.like);
      if (p) { p.liked = !p.liked; p.likedAt = p.liked ? Date.now() : null; save(); renderProfilePanel(); }
      return;
    }
    const sv = e.target.closest('[data-save]');
    if (sv) {
      const p = (S.posts || []).find(x => x.id === sv.dataset.save);
      if (p) { p.saved = !p.saved; p.savedAt = p.saved ? Date.now() : null; save(); if (CUR === 'collect') renderCollect(); else renderProfilePanel(); }
      return;
    }
    const cm = e.target.closest('[data-cmt]');
    if (cm) { openComments(cm.dataset.cmt); return; }
    const rp = e.target.closest('[data-repost]');
    if (rp) { repostPost(rp.dataset.repost); return; }
  });

  const si = $('#searchInput'), sc = $('#searchClear'), sr = $('#searchResults');
  if (si) si.addEventListener('input', e => renderSearchResults(e.target.value));
  if (sc) sc.addEventListener('click', () => { si.value = ''; renderSearchResults(''); si.focus(); });
  if (sr) sr.addEventListener('click', e => {
    const row = e.target.closest('[data-mid]');
    if (row) jumpToMessage(row.dataset.mid);
  });
}

function rowHtml(m) {
  const st = S.settings;
  const mine = m.role === 'me';
  if (m.recalled) return `<div class="sysline">${mine ? '你' : '对方'}撤回了一条消息</div>`;
  if (m.role === 'system') {
    /* 只在聊天界面补：14:03 已拒绝 视频通话 响铃 3 秒。m.text 本身不动，时间轴 / 通话记录读的就是它 */
    const at = m.callAt ? callClock(m.callAt) + ' ' : '';
    if (m.callSec && m.callStatus) {
      return `<div class="sysline" data-id="${m.id}">${at}${esc(m.callStatus)} ${esc(m.callKind || '')} 响铃 ${m.callSec} 秒</div>`;
    }
    return `<div class="sysline" data-id="${m.id}">${at}${esc(m.text)}</div>`;
  }
  const name = mine ? S.me.name : peerLabel();
  const person = mine ? S.me : S.peer;

  const initial = esc(((name || '·').trim().slice(0, 1)) || '·');
  const showWho = false;
  const checks = mine
    ? `<svg class="checks${m.read ? '' : ' unread'}" viewBox="0 0 17 11"><path d="M1.2 6.4l3 3 5.2-7"/><path d="M6.6 8.6l1.6 1.8 7.4-9.4"/></svg>`
    : '';
  const stateTxt = mine ? msgStateText(m) : '';

    ? `<div class="bub bub-sticker">${MEDIA[m.sticker] ? `<img src="${MEDIA[m.sticker]}" alt="">` : ''}</div>`
    : `<div class="bub">${m.quote ? `<span class="quote">${esc(m.quote.text)}</span>` : ''}${esc(m.text)}</div>`) + meta;

/* 站内提示：页头下方一个毛玻璃小胶囊，2.6 秒后自行消失；点它进聊天 */
let hintTimer = null;
function showMsgHint(text) {
  if (S.settings.hintOn === false) return;
  const el = document.getElementById('msgHint');
  if (!el) return;
  const t = decodeMentions(String(text || '')).replace(/\s+/g, ' ').trim();
  if (!t) return;
  const nm = el.querySelector('.nm'), ms = el.querySelector('.ms');
  if (nm && ms) {
    nm.textContent = peerLabel() || '对方';
    ms.textContent = t.length > 26 ? t.slice(0, 26) + '…' : t;
  } else {
    el.querySelector('.lt').textContent = (peerLabel() || '对方') + '：' + t;
  }
  /* 贴在当前页页头下方 8px：不压标题，也不碰右上角按钮 */
  const hd = document.querySelector('.app-page.open .day-bar') ||
             document.querySelector('.app-page.open .tt') ||
             document.querySelector('.panel.active .tt');
  if (hd) el.style.top = Math.round(hd.getBoundingClientRect().bottom + 8) + 'px';
  el.classList.remove('on');
  void el.offsetWidth;
  el.classList.add('on');
  clearTimeout(hintTimer);
  hintTimer = setTimeout(() => el.classList.remove('on'), 2600);
}

function pushMsg(m) {
  S.messages.push(m);
  if (S.messages.length > 1200) S.messages.splice(0, S.messages.length - 1200);
  /* 正在聊天页里看着，就把这条归为“已看到”，不然会凭空多出未读 */
  if (CUR === 'chat') S.lastSeen = Math.max(S.lastSeen || 0, m.ts);
  save();
  updateTabDots();
  renderChats();
  /* 不在聊天页时，顶部给一条极轻的提示 */
  if (m.role === 'peer' && CUR !== 'chat' && CUR !== 'pcard' && !m.recalled) showMsgHint(m.text);
  // 我发出的消息：过一会儿对方“看到”（离线未回来的那条不算）
  if (m.role === 'me' && !m.holdRead) {
    setTimeout(() => {
      const msg = S.messages.find(x => x.id === m.id);
      if (!msg || msg.read) return;
      msg.read = true;
      msg.readTs = Date.now();
      save();
      if (CUR === 'chat') renderMsgs();
    }, rand(1500, 5200));
  }
}

/* 气泡下方的状态：未读 / 已读 / 已读不回 */
function msgStateText(m) {
  const st = S.settings;
  if (!st.readStateOn) return '';
  if (!m.read) return '未读';
  const replied = S.messages.some(x => x.role === 'peer' && x.ts > m.ts && !x.recalled);
  const mins = Number(st.readIgnoreMin) || 0;
  if (!replied && mins > 0) {
    const waited = (Date.now() - (m.readTs || m.ts)) / 60000;
    if (waited >= mins) return '已读不回';
  }
  return st.readText || '已读';
}

function addPeerMsg(text, extra) {
  S.messages.forEach(m => { if (m.role === 'me') m.read = true; });
  pushMsg(Object.assign({ id: uid(), role: 'peer', text, ts: Date.now() }, extra || {}));
  if (CUR === 'chat') S.lastSeen = Date.now();
  renderMsgs();
  renderChats();
  updateTabDots();
  notifyIfNeeded(text);
  /* 对方来消息：在聊天界面里就放和自己发送同一套音效；不在聊天界面时走通知音效 */
  if (document.visibilityState === 'visible') {
    if (CUR === 'chat') playSendSound();
    else playNotifySound();
  }
}

/* ===== 问卷：我出题，对方作答 ===== */
let svDraft = { mode: 'single', text: '', opts: ['', ''] };
const svPending = {};   /* 还没作答的问卷：id → 预定时间 */
const SV_MAX_OPT = 6;
const SV_NUM = ['一', '二', '三', '四', '五', '六'];

function svOptRowsHtml() {
  return svDraft.opts.map((o, i) => `
    <div class="sv-optrow" data-oi="${i}">
      <input class="m-input" data-svopt="${i}" placeholder="选项${SV_NUM[i] || i + 1}" value="${esc(o)}">
      ${svDraft.opts.length > 2 ? `<button class="sv-del" data-svdel="${i}">×</button>` : ''}
    </div>`).join('');
}

/* 出题弹窗：跟「添加字卡」同一个居中弹窗样式 */
function openSurveyCompose(seed) {
  if (seed && seed.qs && seed.qs[0]) {
    seed = { mode: seed.qs[0].mode, text: seed.qs[0].text, opts: seed.qs[0].opts.slice() };
  }
  svDraft = seed && seed.mode
    ? { mode: seed.mode, text: seed.text || '', opts: (seed.opts || ['', '']).slice() }
    : { mode: 'single', text: '', opts: ['', ''] };
  const el = openSheet(`
    <div class="m-blk">
      <div class="sv-hd">
        <h4>问卷</h4>
        <button class="sv-reclink" data-svrec>问卷记录<svg viewBox="0 0 24 24"><path d="M9.5 5.5L16 12l-6.5 6.5"/></svg></button>
      </div>
      <div class="m-field" style="padding-top:0">
        <span>类型</span>
        <span class="sv-seg">
          <button data-svmode="single" class="${svDraft.mode === 'single' ? 'on' : ''}">单选</button>
          <button data-svmode="multi" class="${svDraft.mode === 'multi' ? 'on' : ''}">多选</button>
        </span>
      </div>
      <input class="m-input" id="svQ" placeholder="问题" value="${esc(svDraft.text)}">
      <div id="svOpts">${svOptRowsHtml()}</div>
      <button class="sv-add" data-svaddopt><svg viewBox="0 0 24 24"><path d="M12 5v14M5 12h14"/></svg>添加选项</button>
    </div>
    <button class="m-row" data-x="send"><span class="sp">发送</span></button>
    <button class="m-row cancel" data-x="cancel">取消</button>`, el => {
    setTimeout(() => { const q = el.querySelector('#svQ'); if (q) q.focus(); }, 160);

    el.addEventListener('input', e => {
      const t = e.target;
      if (t.id === 'svQ') { svDraft.text = t.value; return; }
      if (t.dataset.svopt !== undefined) svDraft.opts[+t.dataset.svopt] = t.value;
    });

    el.addEventListener('click', e => {
      const rec = e.target.closest('[data-svrec]');
      if (rec) { openSurveyRecords(); return; }
      const mode = e.target.closest('[data-svmode]');
      if (mode) {
        svDraft.mode = mode.dataset.svmode;
        el.querySelectorAll('[data-svmode]').forEach(b => b.classList.toggle('on', b.dataset.svmode === svDraft.mode));
        return;
      }
      if (e.target.closest('[data-svaddopt]')) {
        if (svDraft.opts.length < SV_MAX_OPT) {
          svDraft.opts.push('');
          el.querySelector('#svOpts').innerHTML = svOptRowsHtml();
        }
        return;
      }
      const del = e.target.closest('[data-svdel]');
      if (del) {
        if (svDraft.opts.length > 2) {
          svDraft.opts.splice(+del.dataset.svdel, 1);
          el.querySelector('#svOpts').innerHTML = svOptRowsHtml();
        }
        return;
      }
      const b = e.target.closest('[data-x]');
      if (!b) return;
      if (b.dataset.x === 'send') { publishSurvey(); return; }
      closeSheet();
    });
  }, 'center');
}

function publishSurvey() {
  const qtext = (svDraft.text || '').trim();
  const opts = svDraft.opts.map(o => (o || '').trim()).filter(Boolean);
  if (!qtext) return toast('先写一个问题');
  if (opts.length < 2) return toast('至少要有两个选项');
  const m = {
    id: uid(), role: 'me', text: '[问卷]', ts: Date.now(),
    survey: { qs: [{ mode: svDraft.mode, text: qtext, opts }], at: Date.now(), answeredAt: null }
  };
  pushMsg(m);
  S.lastSeen = Math.max(S.lastSeen || 0, m.ts);
  save();
  renderMsgs(); renderChats(); updateTabDots();
  closeSheet();
  toast('已发出');
  scheduleSurveyAnswer(m.id);
}

/* 对方不一定紧接着回：45 秒到 5 分钟之间随手挑一个点 */
function scheduleSurveyAnswer(id) {
  const st = S.settings;
  const lo = Math.max(1, Math.min(30, Number(st.surveyWaitMin) || 1));
  const hi = Math.max(lo, Math.min(60, Number(st.surveyWaitMax) || 5));
  const wait = Math.round((lo + Math.random() * (hi - lo)) * 60000);
  svPending[id] = Date.now() + wait;
  setTimeout(() => {
    const m = S.messages.find(x => x.id === id);
    delete svPending[id];
    if (!m || !m.survey || m.survey.answeredAt) return;
    ensurePeerOnline();
    finishSurveyReply(id);
  }, wait);
}

function finishSurveyReply(id) {
  delete svPending[id];
  const m = S.messages.find(x => x.id === id);
  if (!m || !m.survey || m.survey.answeredAt) return;
  const qs = m.survey.qs || [];
  const answers = qs.map(q => {
    const n = q.opts.length;
    const idxs = [];
    if (q.mode === 'multi') {
      q.opts.forEach((_, i) => { if (Math.random() < 0.55 / (i + 1)) idxs.push(i); });
      if (!idxs.length) idxs.push(0);
    } else {
      let r = Math.random() * q.opts.reduce((s, _, i) => s + 1 / (i + 1.6), 0);
      let k = 0;
      for (let i = 0; i < n; i++) { k = i; r -= 1 / (i + 1.6); if (r <= 0) break; }
      idxs.push(k);
    }
    return idxs.sort((a, b) => a - b);
  });
  const cards = pool();
  const remark = cards.length ? pick(cards).text.replace(/\s+$/, '') : '';
  m.survey.answeredAt = Date.now();
  save();
  addPeerMsg('[问卷]', { survey: Object.assign({}, m.survey, { answers, remark, of: m.id }) });
}

/* 聊天里的卡：我发的铺开题目和选项、不可点；对方答完发回来的才可点 */
function surveyCardHtml(m) {
  const s = m.survey || {};
  const qs = s.qs || [];
  const answered = !!s.answers;
  const icon = '<svg viewBox="0 0 24 24"><path d="M7 4h10a2 2 0 0 1 2 2v14l-7-3.6L5 20V6a2 2 0 0 1 2-2z"/></svg>';

/* -------- card pool -------- */
function pool() {
  const hidden = new Set(S.cats.filter(c => c.hidden).map(c => c.id));
  return S.cards.filter(c => !c.hidden && !hidden.has(c.catId));
}

function buildQuote() {
  const mine = S.messages.filter(m => m.role === 'me' && !m.recalled).slice(-10);
  if (!mine.length) return null;
  const m = pick(mine);
  return { text: m.text.length > 46 ? m.text.slice(0, 46) + '…' : m.text };
}

function sampleCards(cards, n) {
  const a = cards.slice();
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a.slice(0, n);
}

/* 对方要开口之前，必须先在线上：处于离线就先恢复上线 */
function ensurePeerOnline() {
  try {
    if (window.tlPeerState && !window.tlPeerState().online && window.tlGoOnline) {
      window.tlGoOnline();
      if (typeof refreshPeerStatus === 'function') refreshPeerStatus();
    }
  } catch (e) { }
}

function deliverReply() {
  ensurePeerOnline();
  const st = S.settings;
  const stickers = (S.stickers || []).filter(s => MEDIA['sticker:' + s.id]);
  const cards = pool();
  if (!cards.length && !stickers.length) { toast('字卡和表情都还是空的'); return; }
  const cMin = Math.max(1, Math.min(10, Number(st.countMin) || 1));
  const cMax = Math.max(cMin, Math.min(10, Number(st.countMax) || cMin));
  const n = randInt(cMin, cMax);
  const ratio = Math.max(0, Math.min(100, Number(st.stickerRatio) || 0));
  /* 每条独立撑一次：比例以内是表情，以外是字卡（不是整轮二选一） */
  const kinds = [];
  for (let i = 0; i < n; i++) {
    kinds.push(stickers.length && Math.random() * 100 < ratio ? 'sticker' : 'text');
  }
  if (!stickers.length) kinds.fill('text');
  if (!cards.length) kinds.fill('sticker');
  const textCount = kinds.filter(k => k === 'text').length;
  const texts = sampleCards(cards, textCount).map(c => c.text);
  const quote = st.quoteOn && Math.random() * 100 < st.quoteRate ? buildQuote() : null;
  /* 同一轮里不重复同一个表情，也不跟她上一条重复 */
  const lastMine = [...S.messages].reverse().find(x => x.sticker && x.role === 'me');
  let sPool = lastMine && stickers.length > 1
    ? stickers.filter(s => 'sticker:' + s.id !== lastMine.sticker)
    : stickers.slice();
  if (!sPool.length) sPool = stickers.slice();
  let ti = 0, qi = 0;
  const seq = kinds.map(k => {
    if (k === 'sticker') {
      const s = pick(sPool);
      if (sPool.length > 1) sPool = sPool.filter(x => x.id !== s.id);
      return { sticker: 'sticker:' + s.id };
    }
    return { text: texts[ti++], quote: qi++ === 0 ? quote : null };
  });
  stepDeliver(seq, 0);
}

function stepDeliver(seq, i) {
  if (i >= seq.length) return;
  const it = seq[i];
  if (it.sticker) addPeerMsg('[表情]', { sticker: it.sticker });
  else addPeerMsg(it.text, { quote: it.quote });
  if (i < seq.length - 1) {
    showTyping();
    replyTimer = setTimeout(() => { hideTyping(); stepDeliver(seq, i + 1); }, rand(700, 1700));
  }
}

function showTyping() { typing = true; setPeerStatus('正在输入…'); renderMsgs(); }
function hideTyping() {
  typing = false;
  const t2 = (window.tlPeerState ? tlPeerState() : { online:true, text:'在线' });
  setPeerStatus(t2.text);
  const el = $('#peerStatus'); if (el) el.classList.toggle('off', !t2.online);
  renderMsgs();
}
function setPeerStatus(t) { const el = $('#peerStatus'); if (el) el.textContent = t; }

function triggerReply(opts) {
  ensurePeerOnline();
  const st = S.settings;
  clearTimeout(replyTimer);
  const ghost = st.ghostOn && Math.random() * 100 < st.ghostRate;
  const lo = Math.min(st.delayMin, st.delayMax), hi = Math.max(st.delayMin, st.delayMax);
  showTyping();
  replyTimer = setTimeout(() => {
    hideTyping();
    if (ghost) { S.messages.forEach(m => { if (m.role === 'me') m.read = true; }); save(); renderMsgs(); return; }
    deliverReply();
  }, Math.max(500, rand(lo, hi) * 1000));
}

function armProactive() {
  clearTimeout(proactiveTimer);
  const st = S.settings;
  if (!st.proactiveOn && !st.proactiveCallOn) return;
  const lo = Math.min(st.proactiveMin, st.proactiveMax), hi = Math.max(st.proactiveMin, st.proactiveMax);
  const wait = Math.max(8, rand(lo, hi) * 60) * 1000;
  proactiveTimer = setTimeout(() => {
    const s2 = S.settings;
    if (!s2.proactiveOn && !s2.proactiveCallOn) return;
    /* 还有问卷在等作答：这一轮主动消息直接跳过，不与问卷撞车 */
    if (Object.keys(svPending).length) { armProactive(); return; }
    const wantCall = s2.proactiveCallOn && Math.random() * 100 < s2.proactiveCallRate;
    if (wantCall) {
      /* 对方来电：语音 / 视频 各 50% */
      incomingCall(Math.random() < 0.5 ? 'voice' : 'video');
    } else if (s2.proactiveOn) {
      ensurePeerOnline();
      if (CUR === 'chat') {
        showTyping();
        replyTimer = setTimeout(() => { hideTyping(); deliverReply(); }, rand(1400, 3200));
      } else { deliverReply(); }
    }
    armProactive();
  }, wait);
}

/* -------- sound -------- */
let AC = null;
function ac() {
  if (AC && AC.state === 'closed') AC = null; /* 上下文被系统关掉就重建 */
  if (!AC) {
    try { AC = new (window.AudioContext || window.webkitAudioContext)(); } catch (e) { return null; }
  }
  return AC;
}
/* 后台放久了上下文会被系统挂起（iOS 还会变成 interrupted），
   用之前必须等 resume 真的完成，光调一下 resume() 是无效的 */
async function ensureAudio() {
  const c = ac();
  if (!c) return null;
  if (c.state === 'running') return c;
  try { await c.resume(); } catch (e) { }
  if (c.state !== 'running') {
    try { c.resume(); } catch (e) { }
    await new Promise(r => setTimeout(r, 40));
  }
  return c;
}
function resumeAudio() {
  if (AC && AC.state !== 'running') { try { AC.resume().catch(() => { }); } catch (e) { } }
}
/* 回到前台 / 点屏幕 / 窗口获得焦点时，把上下文拉回来 */
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') resumeAudio(); });
window.addEventListener('pointerdown', resumeAudio, { passive: true });
window.addEventListener('focus', resumeAudio);

/* -------- 后台保活：极小音量的静音声 + 屏幕常亮，尽量不让计时器被挂起 -------- */
const KeepAlive = { osc: null, gain: null, lock: null };
function startKeepAlive() {
  if (S.settings.keepAlive === false) return;
  try {
    const ctx = ac();
    if (!KeepAlive.osc) {
      const osc = ctx.createOscillator();
      const g = ctx.createGain();
      g.gain.value = 0.00001;
      osc.frequency.value = 30;
      osc.connect(g);
      g.connect(ctx.destination);
      osc.start();
      KeepAlive.osc = osc;
      KeepAlive.gain = g;
    }
  } catch (e) { }
  try {
    if ('wakeLock' in navigator && document.visibilityState === 'visible' && !KeepAlive.lock) {
      navigator.wakeLock.request('screen').then(s => {
        KeepAlive.lock = s;
        s.addEventListener('release', () => { KeepAlive.lock = null; });
      }).catch(() => { });
    }
  } catch (e) { }
}
function stopKeepAlive() {
  try { if (KeepAlive.osc) { KeepAlive.osc.stop(); KeepAlive.osc.disconnect(); } } catch (e) { }
  KeepAlive.osc = null; KeepAlive.gain = null;
  try { if (KeepAlive.lock) KeepAlive.lock.release(); } catch (e) { }
  KeepAlive.lock = null;
}
function tone(freq, delay, dur, type, gain) {
  try {
    const c = ac(); if (!c) return;
    if (c.state !== 'running') { try { c.resume().catch(() => { }); } catch (e) { } }
    const t0 = c.currentTime + delay;
    const o = c.createOscillator(), g = c.createGain();
    o.type = type || 'sine';
    o.frequency.setValueAtTime(freq, t0);
    g.gain.setValueAtTime(0.0001, t0);
    g.gain.exponentialRampToValueAtTime(gain || 0.12, t0 + 0.008);
    g.gain.exponentialRampToValueAtTime(0.0001, t0 + dur);
    o.connect(g).connect(c.destination);
    o.start(t0); o.stop(t0 + dur + 0.03);
  } catch (e) { }
}
function noiseBurst(delay, dur, gain) {
  try {
    const c = ac(); if (!c) return;
    if (c.state !== 'running') { try { c.resume().catch(() => { }); } catch (e) { } }
    const len = Math.floor(c.sampleRate * dur);
    const buf = c.createBuffer(1, len, c.sampleRate);
    const d = buf.getChannelData(0);
    for (let i = 0; i < len; i++) d[i] = (Math.random() * 2 - 1) * (1 - i / len) ** 2;
    const src = c.createBufferSource(); src.buffer = buf;
    const bp = c.createBiquadFilter(); bp.type = 'bandpass'; bp.frequency.value = 2400; bp.Q.value = .9;
    const g = c.createGain(); g.gain.value = gain || 0.09;
    src.connect(bp).connect(g).connect(c.destination);
    src.start(c.currentTime + delay);
  } catch (e) { }
}
async function presetSound(name) {
  const c = await ensureAudio();
  if (!c || c.state !== 'running') return; /* 上下文没拉起来就别徒劳调度 */
  if (name === 'pop') { tone(720, 0, .1, 'sine', .10); tone(1180, .035, .12, 'sine', .06); }
  else if (name === 'bubble') { tone(320, 0, .13, 'sine', .11); tone(520, .04, .12, 'sine', .05); }
  else if (name === 'wood') { tone(430, 0, .07, 'triangle', .13); tone(215, .01, .09, 'sine', .07); }
  else if (name === 'type') { noiseBurst(0, .045, .10); noiseBurst(.06, .05, .07); }
  else { tone(760, 0, .1, 'sine', .09); }
}
async function playSendSound(force) {
  const st = S.settings;
  if (!force && !st.soundOn) return;
  const list = (st.sounds || []).filter(s => MEDIA['sound:' + s.id]);
  let item = null;
  if (list.length) item = st.soundRandom ? pick(list) : (list.find(s => s.id === st.soundId) || list[0]);
  if (item) {
    try { const a = new Audio(MEDIA['sound:' + item.id]); a.volume = .9; await a.play(); return; } catch (e) { }
  }
  await presetSound(st.soundPreset);
}

/* 表情面板：高度固定不变（按能容纳的整行数一次算定），表情多了在里面上下滑 */
function fitStickerPanel() {
  const p = $('#stickerPanel'), g = $('#stickerGrid');
  if (!p || !g) return;
  const cs = getComputedStyle(g);
  const padL = parseFloat(cs.paddingLeft) || 0, padR = parseFloat(cs.paddingRight) || 0;
  const padT = parseFloat(cs.paddingTop) || 0, padB = parseFloat(cs.paddingBottom) || 0;
  const gap = parseFloat(cs.columnGap || cs.gap) || 0, rowGap = parseFloat(cs.rowGap || cs.gap) || gap;
  const cols = Math.max(1, cs.gridTemplateColumns.split(' ').filter(Boolean).length);
  const cw = (g.clientWidth - padL - padR - (cols - 1) * gap) / cols;
  if (!(cw > 0)) return;
  const cell = g.querySelector('.sticker-cell');
  const ch = cell ? cell.getBoundingClientRect().height : cw; /* 格子是 1:1，用实测高度更准 */
  const vh = (window.visualViewport && window.visualViewport.height) || window.innerHeight;
  const cap = Math.min(vh * 0.55, 460);
  const fitRows = Math.min(2, Math.max(1, Math.floor((cap - padT - padB + rowGap) / (ch + rowGap)))); /* 最多 5×2 */
  const h = fitRows * ch + (fitRows - 1) * rowGap + padT + padB;
  p.style.maxHeight = h + 'px';
  g.style.height = h + 'px';
  g.style.maxHeight = h + 'px';
  g.style.gridAutoRows = ch + 'px'; /* 行高写死，否则行会被压扁重叠 */
}
function unfixStickerPanel() {
  const p = $('#stickerPanel'), g = $('#stickerGrid');
  if (p && p.classList.contains('open')) return; /* 正在展开时不要清尺寸 */
  if (p) p.style.maxHeight = '';
  if (g) { g.style.maxHeight = ''; g.style.height = ''; g.style.gridAutoRows = ''; }
}

async function deleteSticker(id) {
  S.stickers = (S.stickers || []).filter(s => s.id !== id);
  delete MEDIA['sticker:' + id];
  try { await Media.del('sticker:' + id); } catch (e) { }
  save();
  renderStickerGrid();
  if (CUR === 'settings') renderSettings();
  toast('已删除表情');
}

function sendSticker(sid) {
  const s = (S.stickers || []).find(x => x.id === sid);
  if (!s) return;
  pushMsg({ id: uid(), role: 'me', text: '[表情]', sticker: 'sticker:' + s.id, ts: Date.now(), read: false });
  forceScroll = true;
  renderMsgs();
  playSendSound();
  triggerReply({});
}

async function importStickers(files) {
  let added = 0;
  for (const f of files) {
    if (/json$/i.test(f.name) || f.type === 'application/json') {
      try {
        const data = JSON.parse(await f.text());
        const arr = (data && data.stickers) || [];
        for (const it of arr) {
          if (!it || !it.data) continue;
          const id = uid();
          await putMedia('sticker:' + id, it.data);
          S.stickers.push({ id, name: it.name || '表情' });
          added++;
        }
      } catch (e) { }
      continue;
    }
    if (!/^image\//.test(f.type)) continue;
    const url = await fileToImage(f, 480, false, 'image/png');
    const id = uid();
    await putMedia('sticker:' + id, url);
    S.stickers.push({ id, name: f.name.replace(/\.[^.]+$/, '') });
    added++;
  }
  if (added) {
    save();
    renderStickerGrid();
    if (TAB === 'settings') renderSettings();
  }
  toast(added ? `已导入 ${added} 个表情` : '没有可导入的内容');
  return added;
}

function exportStickers() {
  const list = (S.stickers || [])
    .map(s => ({ name: s.name, data: MEDIA['sticker:' + s.id] }))
    .filter(s => s.data);
  if (!list.length) { toast('还没有表情'); return; }
  downloadText(`表情包-${stamp()}.json`, JSON.stringify({ app: 'yann-stickers', v: 1, stickers: list }), 'application/json');
  toast(`已导出 ${list.length} 个表情`);
}

function refreshStickerManager() {
  const s = document.querySelector('#sheetHost .sheet');
  if (s) s.innerHTML = `<div class="grab"></div>` + stickerMgrHtml();
  else openStickerManager();

function openStickerManager() {
  mgrManage = false;
  openSheet(stickerMgrHtml(), el => {
    el.addEventListener('click', async e => {
      const cell = e.target.closest('.mgr-cell');
      if (cell && mgrManage) {
        const id = cell.dataset.sid;
        S.stickers = (S.stickers || []).filter(s => s.id !== id);
        delete MEDIA['sticker:' + id];
        try { await Media.del('sticker:' + id); } catch (err) { }
        save(); renderStickerGrid();
        if (TAB === 'settings') renderSettings();
        refreshStickerManager();
        toast('已删除表情');
        return;
      }
      const b = e.target.closest('[data-x]');
      if (!b) return;
      const a = b.dataset.x;
      if (a === 'manage') { mgrManage = !mgrManage; refreshStickerManager(); return; }

        if (files.length) {

/* -------- calls -------- */
const Call = { on: false, type: 'voice', state: '', start: 0, tick: null, timers: [], ring: null };
/* 通话中两个象征性开关（仅 UI 状态） */
let callMicOn = true, callCamOn = true;

function mmss(ms) {
  const s = Math.max(0, Math.floor(ms / 1000));
  return pad(Math.floor(s / 60)) + ':' + pad(s % 60);
}
/* 通话时长文案：min = 分:秒（100:23）；hm = 时:分:秒（1:40:23） */
function callDurText(ms) {
  const mode = (S.settings && S.settings.callClock) || 'min';
  if (mode === 'hm') {
    const s = Math.max(0, Math.floor(ms / 1000));
    return Math.floor(s / 3600) + ':' + pad(Math.floor((s % 3600) / 60)) + ':' + pad(s % 60);
  }
  return mmss(ms);
}
function callLabel(t) { return t === 'video' ? '视频通话' : '语音通话'; }
/* 通话记录统一带时刻：11:12 语音通话 · 未接来电 18 秒 */
function callClock(ts) {
  const d = new Date(ts || Date.now());
  return pad(d.getHours()) + ':' + pad(d.getMinutes());
}
function callRingSec() {
  return Math.max(1, Math.round((Date.now() - (Call.ringStart || Call.ts || Date.now())) / 1000));
}
function sysLine(text, extra) { pushMsg(Object.assign({ id: uid(), role: 'system', text, ts: Date.now() }, extra || {})); renderMsgs(); }

function stopRing() { if (Call.ring) { clearInterval(Call.ring); Call.ring = null; } }
function startRing() {
  stopRing();
  const beat = () => { tone(680, 0, .16, 'sine', .05); tone(920, .2, .18, 'sine', .04); };
  beat();
  Call.ring = setInterval(beat, 1900);
}

function clearCallTimers() {
  Call.timers.forEach(clearTimeout);
  Call.timers = [];
  clearInterval(Call.tick);
  Call.tick = null;
  stopRing();
}

function showCall(type, status, ringing) {
  const scr = $('#call');
  scr.style.pointerEvents = '';   /* 清掉可能残留的内联禁用，保证按钮可点 */
  Call.ts = Date.now();           /* 这通电话发起的时刻，写进系统行 */
  Call.ringStart = Date.now();
  scr.classList.add('on');
  scr.classList.toggle('active', !ringing);
  $('#callKind').textContent = callLabel(type);
  const u = avatarUrl(S.peer.avatar);
  const av = $('#callAv');
  av.style.backgroundImage = u ? `url("${u}")` : '';
  av.textContent = u ? '' : peerInitial();
  $('#callName').textContent = peerLabel();
  $('#callStatus').textContent = status;
  $('#callTimer').classList.add('hidden');
  $('#callAnswer').classList.add('hidden');
  $('#callMin').classList.add('hidden');
  /* 麦克风 / 摄像头每次通话都从“开”开始，且响铃阶段先不显示 */
  callMicOn = true; callCamOn = true;
  $('#callMic').classList.add('hidden');
  $('#callMic').classList.remove('off');
  $('#callCam').classList.add('hidden');
  $('#callCam').classList.remove('off');
  const mini = $('#callMini');
  mini.classList.remove('on');
  mini.style.left = '';
  mini.style.top = '';
  mini.style.right = '';
  $('#cmTime').textContent = '00:00';
}

function endCall(sysText, delay, extra) {
  if (!Call.on || Call.state === 'ended') return;
  Call.state = 'ended';
  clearCallTimers();
  const scr = $('#call');
  Call.timers.push(setTimeout(() => {
    if (Call.state !== 'ended') return;
    scr.classList.remove('on', 'active');
    $('#callMini').classList.remove('on');
    Call.on = false;
    Call.state = '';
    Call.timers = [];
    if (sysText) sysLine(sysText, extra);
  }, delay === undefined ? 700 : delay));
}

function activateCall() {
  Call.state = 'active';
  Call.start = Date.now();
  $('#call').classList.add('active');
  $('#callStatus').textContent = '通话中';
  $('#callAnswer').classList.add('hidden');
  const timer = $('#callTimer');
  timer.classList.remove('hidden');
  timer.textContent = '00:00';
  $('#callMin').classList.remove('hidden');
  /* 通话中：显示麦克风；视频通话额外显示摄像头 */
  $('#callMic').classList.remove('hidden');
  if (Call.type === 'video') $('#callCam').classList.remove('hidden'); else $('#callCam').classList.add('hidden');
  $('#cmTime').textContent = '00:00';
  Call.tick = setInterval(() => {
    const t = callDurText(Date.now() - Call.start);
    timer.textContent = t;
    const cm = $('#cmTime');
    if (cm) cm.textContent = t;
  }, 500);
  if (Math.random() * 100 < S.settings.callHangRate) {
    Call.timers.push(setTimeout(() => {
      if (Call.state !== 'active') return;
      $('#callStatus').textContent = '对方已挂断';
      endCall('通话结束 · ' + callDurText(Date.now() - Call.start), 1000);
    }, rand(6000, 20000)));
  }
}

function outgoingCall(type) {
  if (Call.on) return;
  Call.on = true; Call.type = type; Call.state = 'dialing';
  showCall(type, '正在等待对方接听…', true);
  $('#callMin').classList.remove('hidden');
  startRing();
  const answered = Math.random() * 100 < S.settings.callAnswerRate;
  Call.timers.push(setTimeout(() => {
    if (Call.state !== 'dialing') return;
    stopRing();
    if (answered) {
      activateCall();
    } else {
      $('#callStatus').textContent = '对方无应答';
      endCall(callLabel(type) + ' · 无应答', 1400, { callAt: Call.ts, callSec: callRingSec(), callStatus: '无应答', callKind: callLabel(type) });
    }
  }, rand(2200, 5200)));
}

function incomingCall(type) {
  if (Call.on) return;
  Call.on = true; Call.type = type; Call.state = 'incoming';
  showCall(type, peerLabel() + '邀请您通话', true);
  $('#callAnswer').classList.remove('hidden');
  startRing();
  Call.timers.push(setTimeout(() => {
    if (Call.state !== 'incoming') return;
    stopRing();
    $('#callStatus').textContent = '未接听';
    endCall(callLabel(type) + ' · 未接来电', 1200, { callAt: Call.ts, callSec: callRingSec(), callStatus: '未接来电', callKind: callLabel(type) });
  }, 20000));
}

function minimizeCall() {
  if (!Call.on || Call.state === 'ended') return;
  const u = avatarUrl(S.peer.avatar);
  const av = $('#cmAv');
  av.style.backgroundImage = u ? `url("${u}")` : '';
  av.textContent = u ? '' : peerInitial();
  $('#cmTime').textContent = Call.state === 'active' ? callDurText(Date.now() - Call.start) : '呼叫中';
  $('#callMini').classList.add('on');
  $('#call').classList.remove('on');
}

function restoreCall() {
  $('#callMini').classList.remove('on');
  if (Call.on && Call.state !== 'ended') $('#call').classList.add('on');
}

function hangUp() {
  if (!Call.on) return;
  const st = Call.state;
  if (st === 'incoming') endCall('已拒绝 · ' + callLabel(Call.type), 320, { callAt: Call.ts, callSec: callRingSec(), callStatus: '已拒绝', callKind: callLabel(Call.type) });
  else if (st === 'active') endCall('通话结束 · ' + callDurText(Date.now() - Call.start), 320);
  else if (st === 'dialing') endCall('已取消 · ' + callLabel(Call.type), 320);
}

function bindCall() {
  $('#callHang').addEventListener('click', hangUp);
  $('#callMic').addEventListener('click', () => {
    callMicOn = !callMicOn;
    $('#callMic').classList.toggle('off', !callMicOn);
  });
  $('#callCam').addEventListener('click', () => {
    callCamOn = !callCamOn;
    $('#callCam').classList.toggle('off', !callCamOn);
  });
  $('#cmHang').addEventListener('click', hangUp);
  $('#callMin').addEventListener('click', minimizeCall);
  $('#callAnswer').addEventListener('click', () => {
    if (Call.state !== 'incoming') return;
    stopRing();
    activateCall();
  });

  const mini = $('#callMini');
  let drag = null;
  mini.addEventListener('pointerdown', e => {
    if (e.target.closest('#cmHang')) return;
    const r = mini.getBoundingClientRect();
    drag = { sx: e.clientX, sy: e.clientY, left: r.left, top: r.top, moved: false };
    mini.style.right = 'auto';
    mini.style.left = r.left + 'px';
    mini.style.top = r.top + 'px';
    try { mini.setPointerCapture(e.pointerId); } catch (err) { }
  });
  mini.addEventListener('pointermove', e => {
    if (!drag) return;
    const dx = e.clientX - drag.sx, dy = e.clientY - drag.sy;
    if (!drag.moved && Math.abs(dx) + Math.abs(dy) > 6) drag.moved = true;
    if (!drag.moved) return;
    const w = mini.offsetWidth, h = mini.offsetHeight;
    mini.style.left = Math.max(6, Math.min(window.innerWidth - w - 6, drag.left + dx)) + 'px';
    mini.style.top = Math.max(6, Math.min(window.innerHeight - h - 6, drag.top + dy)) + 'px';
  });
  mini.addEventListener('pointerup', () => {
    if (drag && !drag.moved) restoreCall();
    drag = null;
  });
  mini.addEventListener('pointercancel', () => { drag = null; });
}

};

let menuMsgId = null;
let menuOpenedAt = 0;
let pendingQuote = null;

function openMsgMenu(row, m) {
  const menu = $('#msgMenu');
  const mine = m.role === 'me';
  const items = [];
  if (!m.sticker) items.push(['copy', '复制', MI.copy]);
  items.push(['quote', '引用', MI.quote]);
  if (mine && Date.now() - m.ts < 120000) items.push(['recall', '撤回', MI.recall]);
  items.push(['del', '删除', MI.del]);
  menu.innerHTML = items.map(it => `<button data-m="${it[0]}">${it[2]}<span>${it[1]}</span></button>`).join('') + '<i class="tail"></i>';
  menuMsgId = m.id;
  menuOpenedAt = Date.now();
  menu.classList.remove('below');
  menu.classList.add('on');
  const bubble = row.querySelector('.bub') || row;
  const r = bubble.getBoundingClientRect();
  const w = menu.offsetWidth, h = menu.offsetHeight;
  let left = r.left + r.width / 2 - w / 2;
  left = Math.max(10, Math.min(window.innerWidth - w - 10, left));
  let top = r.top - h - 9;
  if (top < 60) { top = r.bottom + 9; menu.classList.add('below'); }
  menu.style.left = left + 'px';
  menu.style.top = top + 'px';
  const tail = menu.querySelector('.tail');
  if (tail) {
    let tx = r.left + r.width / 2 - left - 5.5;
    tx = Math.max(13, Math.min(w - 25, tx));
    tail.style.left = tx + 'px';
    tail.style.marginLeft = '0';
  }
}

function closeMsgMenu() {
  const menu = $('#msgMenu');
  if (menu) menu.classList.remove('on');
  menuMsgId = null;
}

function recallMsg(m) {
  if (m.role !== 'me') return;
  if (Date.now() - m.ts > 120000) return toast('超过两分钟不能撤回');
  m.recalled = true;
  m.text = '';
  m.quote = null;
  save(); renderMsgs();
  toast('已撤回');
}

function setQuote(m) {
  pendingQuote = { text: m.text, role: m.role };
  const bar = $('#quoteBar');
  bar.classList.remove('hidden');
  bar.querySelector('.qb-who').textContent = (m.role === 'me' ? S.me.name : peerLabel()) + '：';

function clearQuote() {
  pendingQuote = null;

}

$('#msgMenu').addEventListener('click', async e => {
  const b = e.target.closest('[data-m]');

  const act = b.dataset.m;

      if (row && row.classList.contains('me')) { closeMsgMenu(); return; }
      const mm = row ? S.messages.find(x => x.id === row.dataset.id) : null;
      closeMsgMenu();
      openProfileCard('peer');
      return;

    /* 只有点在气泡本体上才弹菜单；点头像、时间、空白处都不弹 */
    const bub = e.target.closest('.bub');

}

/* ================= deck ================= */
let deckQ = '', deckCat = 'all', deckManage = false, deckSort = 'add';
const deckSel = new Set();

PAGE_RENDER.deck = renderDeck;

function catName(id) {
  const c = S.cats.find(x => x.id === id);
  return c ? c.name : '未分组';
}

function ensureCat(name) {
  let c = S.cats.find(x => x.name === name);
  if (!c) { c = { id: uid(), name, hidden: false }; S.cats.push(c); }
  return c;
}

function parseCards(text, defaultCatId) {
  let cur = defaultCatId || 'default';
  const out = [];
  text.split(/\r?\n/).forEach(raw => {
    const line = raw.trim();
    if (!line) return;
    const m = line.match(/^[【\[](.+?)[】\]]\s*(.*)$/);
    if (m) {
      cur = ensureCat(m[1].trim()).id;
      if (m[2] && m[2].trim()) out.push({ catId: cur, text: m[2].trim() });
      return;
    }
    out.push({ catId: cur, text: line });
  });
  return out;
}

function addCardEntries(entries) {
  const seen = new Set(S.cards.map(c => c.text.trim()));
  let added = 0, dup = 0;
  entries.forEach(e => {
    const t = (e.text || '').trim();
    if (!t) return;
    if (seen.has(t)) { dup++; return; }
    seen.add(t);
    S.cards.push({ id: uid(), catId: e.catId || 'default', text: t, hidden: false });
    added++;
  });
  save();
  if (CUR === 'deck' || TAB === 'deck') renderDeck();
  return { added, dup };
}

/* 分组操作：屏蔽 / 改名 / 删除，chip 与分组标题共用 */
async function doGroupAct(a, cid) {
  const cat = S.cats.find(c => c.id === cid);
  if (!cat) return;
  if (a === 'block') {
    cat.hidden = !cat.hidden; save(); renderDeck();
    return toast(cat.hidden ? '已屏蔽该分组' : '已取消屏蔽');
  }
  if (a === 'rename') {
    const name = await uiPrompt('修改组名', cat.name);
    if (name == null) return;
    const v = name.trim();
    if (!v) return toast('组名不能为空');
    cat.name = v; save(); renderDeck();
    return toast('已修改');
  }
  if (a === 'del') {
    if (S.cats.length <= 1) return toast('至少保留一个分组');
    const cnt = S.cards.filter(c => c.catId === cat.id).length;
    if (!await uiConfirm(`删除分组「${cat.name}」？`, cnt ? `${cnt} 张字卡会移到剩下的分组` : '', '删除', true)) return;
    const fallback = (S.cats.find(c => c.id !== cat.id) || {}).id;
    S.cards.forEach(c => { if (c.catId === cat.id) c.catId = fallback; });
    S.cats = S.cats.filter(c => c.id !== cat.id);
    if (deckCat === cat.id) deckCat = 'all';
    save(); renderDeck();
    return toast('已删除分组');
  }
}

function renderDeck() {
  renderChips();
  const q = deckQ.trim().toLowerCase();
  let list = S.cards.filter(c => {
    if (deckCat !== 'all' && c.catId !== deckCat) return false;
    if (q && !c.text.toLowerCase().includes(q)) return false;
    return true;
  });
  const groups = [];
  S.cats.forEach(cat => {
    const cs = list.filter(c => c.catId === cat.id);
    if (!cs.length) return;
    if (deckSort === 'az') cs.sort((a, b) => a.text.localeCompare(b.text, 'zh'));
    groups.push({ cat, cs });
  });
  const orphan = list.filter(c => !S.cats.some(x => x.id === c.catId));
  if (orphan.length) groups.push({ cat: { id: 'default', name: '未分组', hidden: false }, cs: orphan });

  if (!groups.length) {
    $('#deckList').innerHTML = `<div style="text-align:center;color:var(--text-3);font-size:13px;padding:60px 0;letter-spacing:.1em">${q ? '没有匹配的字卡' : '字卡库还是空的'}</div>`;
    return;
  }
  const IC = {
    block: '<svg viewBox="0 0 24 24"><path d="M3.2 12s3.6-6 8.8-6 8.8 6 8.8 6-3.6 6-8.8 6-8.8-6-8.8-6z"/><circle cx="12" cy="12" r="2.4"/><path d="M4.4 4.4l15.2 15.2"/></svg>',
    edit: '<svg viewBox="0 0 24 24"><path d="M4 20l4-1 10-10a2.1 2.1 0 0 0-3-3L5 16z"/><path d="M14.5 6.5l3 3"/></svg>',
    move: '<svg viewBox="0 0 24 24"><path d="M3 7.5A2 2 0 0 1 5 5.5h4l2 2h8a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2z"/></svg>',
    del: '<svg viewBox="0 0 24 24"><path d="M5 7h14M9 7V5h6v2M7 7l1 12h8l1-12"/></svg>'
  };
  let html = '';
  groups.forEach(g => {
    const gid = g.cat.id;
    const canEdit = S.cats.some(x => x.id === gid);
    const gAll = g.cs.length > 0 && g.cs.every(c => deckSel.has(c.id));
    html += `<div class="grp${g.cat.hidden ? ' hidden-grp' : ''}">
      ${deckManage ? `<div class="chk gchk ${gAll ? 'on' : ''}" data-gchk="${gid}"></div>` : ''}
      <span>${esc(g.cat.name)}</span><span class="grp-n">${g.cs.length}</span>
    </div>`;
    g.cs.forEach(c => {
      const sel = deckSel.has(c.id);
      html += `<div class="card-row ${c.hidden ? 'blocked' : ''}" data-id="${c.id}">
        ${deckManage ? `<div class="chk ${sel ? 'on' : ''}"></div>` : ''}
        <div class="card-body">
          <div class="card-text">${esc(c.text)}</div>
          ${deckManage && c.hidden ? `<div class="card-tag">已屏蔽</div>` : ''}
        </div>
        ${deckManage ? '' : '<span class="card-chev"></span>'}
      </div>`;
    });
  });
  const hiddenN = S.cards.filter(c => c.hidden).length;
  html += `<div class="deck-stats">共 ${S.cards.length} 张 · ${S.cats.length} 组${hiddenN ? ` · 已屏蔽 ${hiddenN} 张` : ''}</div>`;
  $('#deckList').innerHTML = html;
  $('#deckManageBar').classList.toggle('on', deckManage);
  const allBtn = $('#deckManageBar [data-m="all"]');
  if (allBtn) {
    const pool = S.cards.filter(c => deckCat === 'all' || c.catId === deckCat);
    const allOn = pool.length > 0 && pool.every(c => deckSel.has(c.id));
    allBtn.textContent = allOn ? '取消全选' : '全选';
  }
  $('#deckAdd').style.display = deckManage ? 'none' : '';
}

      }

function deckToText() {
  const out = [];
  S.cats.forEach(cat => {
    const cs = S.cards.filter(c => c.catId === cat.id);
    if (!cs.length) return;
    out.push(`【${cat.name}】`);
    cs.forEach(c => out.push(c.text));
    out.push('');
  });
  /* catId 指向已删分组的「孤儿卡」也要导出，否则换设备会丢 */
  const orphan = S.cards.filter(c => !S.cats.some(x => x.id === c.catId));
  if (orphan.length) {
    out.push('【未分组】');
    orphan.forEach(c => out.push(c.text));
    out.push('');
  }
  return out.join('\n').trim() + '\n';
}

/* 字卡导入导出：Cards 页顶欄按钮、⋯ 菜单、Data 页三处共用 */
function exportCardsTxt() {

  if (!n) return toast('字卡库是空的');
  downloadText(`字卡-${stamp()}.txt`, deckToText(), 'text/plain');
  toast(`已导出 ${n} 张字卡`);
}

async function importCardsTxt(defCat) {
  const f = await pickFile('.txt,text/plain');
  if (!f) return;
  let txt = '';
  try { txt = await f.text(); } catch (e) { return toast('文件读取失败'); }
  const cat = (defCat && S.cats.some(c => c.id === defCat)) ? defCat : 'default';
  const r = addCardEntries(parseCards(txt, cat));
  toast(r.added ? `导入 ${r.added} 张${r.dup ? `，去重 ${r.dup}` : ''}` : '没有新内容');
  renderDeck();
}

function bindDeck() {
  $('#deckSearch').addEventListener('input', e => { deckQ = e.target.value; renderDeck(); });
  $('#deckCatBtn').addEventListener('click', () => openCatPicker());
  $('#deckCatNew').addEventListener('click', async () => {
    const name = await uiPrompt('新建分组', '', '分组名称');
    if (name && name.trim()) { ensureCat(name.trim()); save(); renderDeck(); }
  });
  $('#deckList').addEventListener('click', async e => {
    const gchk = e.target.closest('[data-gchk]');
    if (gchk) {
      const gid = gchk.dataset.gchk;
      const list = S.cards.filter(c => c.catId === gid || (gid === 'default' && !S.cats.some(x => x.id === c.catId)));
      const allOn = list.length > 0 && list.every(c => deckSel.has(c.id));
      list.forEach(c => { if (allOn) deckSel.delete(c.id); else deckSel.add(c.id); });
      renderDeck();
      return;
    }
    const gact = e.target.closest('[data-gact]');
    if (gact) {
      return doGroupAct(gact.dataset.gact, gact.dataset.gid);
    }
    const cact = e.target.closest('[data-cact]');
    if (cact) {
      const id = cact.dataset.cid;
      const c = S.cards.find(x => x.id === id);
      if (!c) return;
      const a = cact.dataset.cact;
      if (a === 'block') {
        c.hidden = !c.hidden; save(); renderDeck();
        return toast(c.hidden ? '已屏蔽' : '已取消屏蔽');
      }
      if (a === 'edit') return openCardEditor(id);
      if (a === 'move') return openMoveCard(id);
      if (a === 'del') {
        if (!await uiConfirm('删除这张字卡？', c.text, '删除', true)) return;
        S.cards = S.cards.filter(x => x.id !== id);
        deckSel.delete(id);
        save(); renderDeck();
        return toast('已删除');
      }
      return;
    }
    const row = e.target.closest('.card-row');
    if (!row) return;
    const id = row.dataset.id;
    if (deckManage) {
      if (deckSel.has(id)) deckSel.delete(id); else deckSel.add(id);
      renderDeck();
    } else openCardActions(id);
  });

  $('#deckAdd').addEventListener('click', () => openAddSheet(deckCat === 'all' ? 'default' : deckCat));
  $('#deckActTidy').addEventListener('click', () => { deckManage = !deckManage; deckSel.clear(); renderDeck(); });
  /* 顶栏四个工具按钮，常驻 */
  $('#deckActImport').addEventListener('click', () => importCardsTxt(deckCat === 'all' ? 'default' : deckCat));
  $('#deckActExport').addEventListener('click', () => exportCardsTxt());
  $('#deckActGroups').addEventListener('click', () => openCatManager());
  $('#deckManageBar').addEventListener('click', async e => {
    const b = e.target.closest('[data-m]');
    if (!b) return;
    const m = b.dataset.m;
    const ids = [...deckSel];
    if (m === 'done') { deckManage = false; deckSel.clear(); return renderDeck(); }
    if (m === 'all') {
      const pool = S.cards.filter(c => deckCat === 'all' || c.catId === deckCat);
      const allOn = pool.length > 0 && pool.every(c => deckSel.has(c.id));
      if (allOn) deckSel.clear(); else pool.forEach(c => deckSel.add(c.id));
      return renderDeck();
    }
    if (!ids.length) return toast('先选几张');
    if (m === 'del') {
      if (await uiConfirm(`删除 ${ids.length} 张字卡？`, '', '删除', true)) {
        S.cards = S.cards.filter(c => !deckSel.has(c.id));
        deckSel.clear(); save(); renderDeck();
      }
      return;
    }
    if (m === 'block') {

/* 拾色器（HSV）：饱和度/明度方块 + 色相条，同 WPS 的取色面板 */
const hsvToHex = (h, s, v) => {
  h = ((h % 360) + 360) % 360;
  const c = v * s, x = c * (1 - Math.abs(((h / 60) % 2) - 1)), m = v - c;
  let r = 0, g = 0, b = 0;
  if (h < 60) { r = c; g = x; b = 0; }
  else if (h < 120) { r = x; g = c; b = 0; }
  else if (h < 180) { r = 0; g = c; b = x; }
  else if (h < 240) { r = 0; g = x; b = c; }
  else if (h < 300) { r = x; g = 0; b = c; }
  else { r = c; g = 0; b = x; }
  const to = n => Math.round((n + m) * 255).toString(16).padStart(2, '0');
  return '#' + to(r) + to(g) + to(b);
};
const hexToHsv = hex => {
  let s = String(hex || '').replace('#', '');
  if (s.length === 3) s = s.split('').map(c => c + c).join('');
  if (!/^[0-9a-f]{6}$/i.test(s)) s = '6E6E78';
  const r = parseInt(s.slice(0, 2), 16) / 255,
        g = parseInt(s.slice(2, 4), 16) / 255,
        b = parseInt(s.slice(4, 6), 16) / 255;
  const max = Math.max(r, g, b), min = Math.min(r, g, b), d = max - min;
  let h = 0;
  if (d) {
    if (max === r) h = ((g - b) / d) % 6;
    else if (max === g) h = (b - r) / d + 2;
    else h = (r - g) / d + 4;
    h *= 60;
    if (h < 0) h += 360;
  }
  return { h, s: max ? d / max : 0, v: max };
};

function openBubblePick(target) {
  const T = target || 'bubbleMeBg';
  const start = hexToHsv(S.settings[T] || defaultBubColor(T));
  let hh = start.h, ss = start.s, vv = start.v;

  const paint = () => {
    const el = document.querySelector('.sheet');
    if (!el) return;
    const sv = el.querySelector('.cp-sv'), dot = el.querySelector('.cp-dot');
    const hue = el.querySelector('.cp-hue'), hd = el.querySelector('.cp-hue-dot');
    const hexIn = el.querySelector('#cpHex');
    const hex = hsvToHex(hh, ss, vv);
    if (sv) { sv.style.backgroundColor = 'hsl(' + hh + ' 100% 50%)'; }
    if (dot) { dot.style.left = (ss * 100) + '%'; dot.style.top = ((1 - vv) * 100) + '%'; dot.style.backgroundColor = hex; }
    if (hd) { hd.style.left = (hh / 360 * 100) + '%'; }
    if (hexIn && document.activeElement !== hexIn) hexIn.value = hex.toUpperCase();
  };

  const commit = () => {
    S.settings[T] = hsvToHex(hh, ss, vv);
    applyBubbleColors();
  };

  openSheet(`
    <h3>${BUB_LABELS[T]}</h3>
    <div class="cp">
      <div class="cp-sv" data-cp="sv"><i class="cp-dot"></i></div>
      <div class="cp-hue" data-cp="hue"><i class="cp-hue-dot"></i></div>
      <div class="cp-foot">
        <input class="cp-hex" id="cpHex" value="${hsvToHex(hh, ss, vv).toUpperCase()}" maxlength="7" spellcheck="false">
        <button class="tiny-btn" data-x="reset">恢复默认</button>
      </div>
    </div>
    <div class="sheet-actions"><button data-x="ok" class="primary">完成</button></div>`, el => {
    paint();

    const bind = (sel, handler) => {
      const box = el.querySelector(sel);
      if (!box) return;
      let drag = false;
      box.addEventListener('pointerdown', e => {
        drag = true;
        try { box.setPointerCapture(e.pointerId); } catch (err) { }
        handler(e);
      });
      box.addEventListener('pointermove', e => { if (drag) handler(e); });
      const stop = () => { if (drag) { drag = false; save(); } };
      box.addEventListener('pointerup', stop);
      box.addEventListener('pointercancel', stop);
    };

    bind('[data-cp="sv"]', e => {
      const r = el.querySelector('.cp-sv').getBoundingClientRect();
      ss = Math.min(1, Math.max(0, (e.clientX - r.left) / r.width));
      vv = Math.min(1, Math.max(0, 1 - (e.clientY - r.top) / r.height));
      commit(); paint();
    });

    bind('[data-cp="hue"]', e => {
      const r = el.querySelector('.cp-hue').getBoundingClientRect();
      hh = Math.min(359.9, Math.max(0, (e.clientX - r.left) / r.width * 360));
      commit(); paint();
    });

    el.querySelector('#cpHex').addEventListener('change', e => {
      const v = e.target.value.trim();
      if (!/^#?[0-9a-f]{6}$/i.test(v)) { paint(); return; }
      const c = hexToHsv(v);
      hh = c.h; ss = c.s; vv = c.v;
      commit(); save(); paint();
    });

    el.addEventListener('click', e => {
      const b = e.target.closest('[data-x]');
      if (!b) return;
      if (b.dataset.x === 'ok') {
        if (S.settings[T]) save();
        closeSheet();
        renderSettings();
        return;
      }
      if (b.dataset.x === 'reset') {
        S.settings[T] = '';
        save();
        applyBubbleColors();
        const d = hexToHsv(defaultBubColor(T));
        hh = d.h; ss = d.s; vv = d.v;
        paint();
      }
    });
  });
}
