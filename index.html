/* 每一条可调项右侧都加一个「恢复默认」小按钮（同一行有多项时一并恢复） */
function addRowResets() {
  const map = new Map();
  document.querySelectorAll('#settingsBody .group [data-k],#settingsBody .group [data-sw],#settingsBody .group [data-seg],#settingsBody .group [data-range],#settingsBody .group [data-t]').forEach(el => {
    const path = el.dataset.k || el.dataset.sw || el.dataset.seg || el.dataset.range || (el.dataset.t ? 'settings.' + el.dataset.t : '');
    if (!path || path.indexOf('.') < 0) return;
    const row = el.closest('.row-s') || el.closest('.row-col');
    if (!row) return;
    if (!map.has(row)) map.set(row, new Set());
    map.get(row).add(path);
  });
  map.forEach((paths, row) => {
    const list = [...paths];
    // 只给「带滑块的项」和「需要填写链接/自定义样式的项」恢复键
    const hasRange = !!row.querySelector('[data-range]');
    const isLinkish = list.some(p => p === 'settings.customFF' || p === 'settings.bubbleCss');
    if (!hasRange && !isLinkish) return;
    if (row.querySelector('.rst')) return;
    const b = document.createElement('button');
    b.className = 'rst';
    b.dataset.act = 'reset:one';
    b.dataset.paths = list.join('|');
    b.textContent = '↺';
    b.setAttribute('aria-label', '恢复默认');
    if (row.classList.contains('row-col')) {
      const lab = row.querySelector('.lab');
      if (lab) {
        lab.style.display = 'flex';
        lab.style.alignItems = 'center';
        lab.style.gap = '8px';
        lab.appendChild(b);
      } else row.appendChild(b);
    } else {
      row.appendChild(b);
    }
  });
}

function bindSettings() {
  const body = $('#settingsBody');
  const sback = $('#settingsBack');
  if (sback) sback.addEventListener('click', () => {
    SETTINGS_VIEW = null;
    renderSettings();
    const b = $('#settingsBody');
    if (b) b.scrollTop = 0;
  });

  body.addEventListener('click', async e => {
    const ct = e.target.closest('[data-color-target]');
    if (ct) { bubPickTarget = ct.dataset.colorTarget; renderSettings(); return; }
    const scat = e.target.closest('[data-scat]');
    if (scat) {
      SETTINGS_VIEW = scat.dataset.scat;
      renderSettings();
      const b = $('#settingsBody');
      if (b) b.scrollTop = 0;
      return;
    }
    const meEdit = e.target.closest('[data-act="me:edit"]');
    if (meEdit) { openProfileEditor('me'); return; }
    const sw = e.target.closest('[data-sw]');
    if (sw) {
      const p = sw.dataset.sw;
      const v = !getPath(p);
      setPath(p, v);
      sw.classList.toggle('on', v);
      save();
      if (p === 'settings.proactiveOn') { armProactive(); }
      if (p === 'settings.keepAlive') { v ? startKeepAlive() : stopKeepAlive(); }
      if (p === 'settings.peerPostOn') { armPeerPost(); }
      if (p === 'settings.notifyOn' && v) {
        if ('Notification' in window && Notification.permission === 'default') {
          try { const r = await Notification.requestPermission(); if (r !== 'granted') toast('通知权限未开启'); } catch (err) { }
        }
      }
      return;
    }
    const segBtn = e.target.closest('[data-seg] button');
    if (segBtn) {
      const path = segBtn.closest('[data-seg]').dataset.seg;
      const cur = getPath(path);
      const raw = segBtn.dataset.v;
      setPath(path, typeof cur === 'number' ? Number(raw) : raw);
      save();
      if (path === 'settings.theme') applyTheme();
      if (path === 'settings.ff') applyFont();
      if (path === 'settings.soundPreset') presetSound(raw);
      if (path === 'settings.notifySoundPreset') presetSound(raw);
      renderSettings();
      return;
    }
    const act = e.target.closest('[data-act]');
    if (!act) return;
    const a = act.dataset.act;
    if (a === 'font:pick') {
      const f = await pickFile('.ttf,.otf,.woff,.woff2,font/*');
      if (!f) return;
      if (f.size > 6 * 1024 * 1024) return toast('字体文件太大（限 6MB）');
      const url = await readFileAsDataURL(f);
      await putMedia('font.custom', url);
      S.settings.fontKey = 'font.custom';
      save(); applyFont(); renderSettings();
      return toast('字体已导入');
    }
    if (a === 'font:clear') {
      S.settings.fontKey = null;
      delete MEDIA['font.custom'];
      try { await Media.del('font.custom'); } catch (err) { }
      save(); applyFont(); renderSettings();
      return toast('已移除自定义字体');
    }
    if (a === 'reset:block') {
      const d = defaultState();
      (act.dataset.keys || '').split('|').filter(Boolean).forEach(p => {
        const i = p.indexOf('.');
        const root = p.slice(0, i), k = p.slice(i + 1);
        const src = root === 'settings' ? d.settings : root === 'me' ? d.me : root === 'peer' ? d.peer : null;
        if (!src) return;
        const obj = root === 'settings' ? S.settings : root === 'me' ? S.me : S.peer;
        const v = src[k];
        if (v === undefined) { delete obj[k]; return; }
        setPath(p, Array.isArray(v) ? v.slice() : (v && typeof v === 'object' ? JSON.parse(JSON.stringify(v)) : v));
      });
      save(); applyTheme(); applyBubbleColors(); renderSettings();
      return toast('已恢复本节默认');
    }
    if (a === 'reset:one') {
      const d = defaultState();
      (act.dataset.paths || '').split('|').filter(Boolean).forEach(p => {
        const i = p.indexOf('.');
        const root = p.slice(0, i), k = p.slice(i + 1);
        const src = root === 'settings' ? d.settings : root === 'me' ? d.me : root === 'peer' ? d.peer : null;
        if (!src) return;
        const obj = root === 'settings' ? S.settings : root === 'me' ? S.me : S.peer;
        const v = src[k];
        if (v === undefined) { delete obj[k]; return; }
        setPath(p, Array.isArray(v) ? v.slice() : (v && typeof v === 'object' ? JSON.parse(JSON.stringify(v)) : v));
      });
      save(); applyTheme(); applyBubbleColors(); renderSettings();
      return toast('已恢复默认');
    }
    if (a === 'bubble:pick') { openBubblePick(act.dataset.t); return; }
    if (a === 'bubble:reset') {
      ['bubbleYouBg', 'bubbleYouFg', 'bubbleMeBg', 'bubbleMeFg'].forEach(k => { S.settings[k] = ''; });
      save(); applyBubbleColors(); renderSettings();
      return toast('已恢复默认');
    }
    if (a === 'bg:pick') {
      const f = await pickFile('image/*');
      if (!f) return;
      const url = await fileToImage(f, 1400, false);
      await putMedia('bg', url);
      S.settings.bgKey = 'bg';
      save(); renderSettings();
      return toast('背景已更换');
    }
    if (a === 'bg:clear') {
      delete S.settings.bgKey; save(); renderSettings();
      toast('已移除背景');
      return;
    }
    if (a.startsWith('av:')) {
      const parts = a.split(':');
      const f = await pickFile('image/*');
      if (!f) return;
      const url = await fileToImage(f, 320, true);
      if (parts[1] === 'me') { await putMedia('me.av', url); S.me.avatar = 'me.av'; }
      else if (parts[1] === 'peer') { await putMedia('peer.av', url); S.peer.avatar = 'peer.av'; }
      syncIdentity(); renderSettings();
      return;
    }
    if (a === 'notify:add') {
      const f = await pickFile('audio/*');
      if (!f) return;
      if (f.size > 3.5 * 1024 * 1024) return toast('音效请小于 3MB');
      const url = await readFileAsDataURL(f);
      const id = uid();
      await putMedia('sound:' + id, url);
      S.settings.sounds = S.settings.sounds || [];
      S.settings.sounds.push({ id, name: f.name.replace(/\.[^.]+$/, '') });
      S.settings.notifySoundId = id;
      save(); renderSettings();
      { const m = MEDIA['sound:' + id]; if (m) { try { const au = new Audio(m); au.volume = .9; await au.play(); } catch (err) { } } }
      return toast('已设为通知音效');
    }
    if (a === 'notify:builtin') {
      S.settings.notifySoundId = null; save(); renderSettings();
      return toast('已改用内置提示音');
    }
    if (a.startsWith('notify:pick:')) {
      S.settings.notifySoundId = a.split(':')[2]; save(); renderSettings(); playNotifySound();
      return toast('已设为通知音效');
    }
    if (a === 'sound:add') {
      const f = await pickFile('audio/*');
      if (!f) return;
      if (f.size > 3.5 * 1024 * 1024) return toast('音效请小于 3MB');
      const url = await readFileAsDataURL(f);
      const id = uid();
      await putMedia('sound:' + id, url);
      S.settings.sounds = S.settings.sounds || [];
      S.settings.sounds.push({ id, name: f.name.replace(/\.[^.]+$/, '') });
      if (!S.settings.soundId) S.settings.soundId = id;
      save(); renderSettings();
      return toast('音效已添加');
    }
    if (a === 'sticker:add') {
      const files = await pickFiles('image/*');
      if (files.length) await importStickers(files);
      return;
    }
    if (a.startsWith('sound:pick:')) {
      S.settings.soundId = a.split(':')[2];
      save(); renderSettings();
      {
        const m = MEDIA['sound:' + S.settings.soundId];
        if (m) { try { const au = new Audio(m); au.volume = .9; await au.play(); } catch (err) { } }
      }
      return toast('已设为默认音效');
    }
    if (a.startsWith('sound:play:')) {
      const id = a.split(':')[2];
      const m = MEDIA['sound:' + id];
      if (m) { try { const au = new Audio(m); au.volume = .9; await au.play(); } catch (err) { } }
      return;
    }
    if (a.startsWith('sound:del:')) {
      const id = a.split(':')[2];
      S.settings.sounds = (S.settings.sounds || []).filter(s => s.id !== id);
      delete MEDIA['sound:' + id];
      try { await Media.del('sound:' + id); } catch (err) { }
      if (S.settings.soundId === id) S.settings.soundId = (S.settings.sounds[0] || {}).id || null;
      save(); renderSettings();
      return;
    }
  });

  body.addEventListener('input', e => {
    const t = e.target;
    if (t.dataset.color) {
      S.settings[t.dataset.color] = t.value;
      save(); applyBubbleColors();
      return;
    }
    if (t.dataset.k) {
      const path = t.dataset.k;
      const isNum = t.type === 'number';
      let v = isNum ? Number(t.value) : t.value;
      /* 允许 0（如「已读不回判定」设 0 = 关闭），只挡负数和非法值 */
      if (isNum) { v = Math.round(v); if (!isFinite(v) || v < 0) v = 0; }
      setPath(path, v);
      save();
      if (path === 'settings.customFF') applyFont();
      if (path.indexOf('settings.peerPost') === 0) armPeerPost();
      if (path === 'me.name' || path === 'peer.name') syncIdentity();
      return;
    }
    if (t.dataset.range) {
      const path = t.dataset.range;
      const v = Number(t.value);
      setPath(path, v);
      const val = $(`[data-val="${path}"]`);
      if (path === 'settings.stickerRatio') {
        setPath('settings.cardRatio', 100 - v);
        if (val) val.textContent = `表情 ${v}% · 字卡 ${100 - v}%`;
      } else if (val) {
        val.textContent = v + (t.dataset.unit || '');
      }
      if (path === 'settings.fontSize' || path === 'settings.radius') applyTheme();
      save();
      return;
    }
    if (t.dataset.mem) {
      /* 群聊已移除，不再有群员名编辑 */
    }
  });
}

/* ================= 数据自检：把明显错误的数据直接剔掉 ================= */
function sanitizeData(){
  let fixed = 0;
  const now = Date.now();
  const okType = { look:1, linger:1, old:1 };

  /* 时间轴的生成事件 */
  const T = S.timeline;
  if (T && T.events && typeof T.events === 'object') {
    Object.keys(T.events).forEach(key => {
      const m = /^(\d{4})-(\d{2})-(\d{2})$/.exec(key);
      if (!m) { delete T.events[key]; fixed++; return; }
      const base = new Date(+m[1], +m[2]-1, +m[3]).getTime();
      const seen = new Set();
      const list = (Array.isArray(T.events[key]) ? T.events[key] : []).filter(e => {
        if (!e || !okType[e.type]) { fixed++; return false; }
        const ts = Number(e.ts);
        if (!isFinite(ts)) { fixed++; return false; }
        if (ts > now) { fixed++; return false; }                       /* 未来时间 */
        if (ts < base || ts >= base + 86400000) { fixed++; return false; } /* 落到别的日子 */
        const mk = e.type + ':' + Math.floor(ts / 60000);
        if (seen.has(mk)) { fixed++; return false; }                   /* 同一分钟同类重复 */
        seen.add(mk);
        return true;
      });
      if (!list.length) delete T.events[key]; else T.events[key] = list;
    });
  }

  /* 离线表 */
  if (T && T.presence && typeof T.presence === 'object') {
    Object.keys(T.presence).forEach(key => {
      const raw = Array.isArray(T.presence[key]) ? T.presence[key] : [];
      const segs = raw.filter(s => Array.isArray(s) && s.length === 2 &&
        isFinite(s[0]) && isFinite(s[1]) && s[0] >= 0 && s[1] <= 1440 && s[1] > s[0]);
      if (segs.length !== raw.length) fixed++;
      if (!segs.length) delete T.presence[key]; else T.presence[key] = segs;
    });
  }

  /* 重要的日子 */
  if (T && T.days && typeof T.days === 'object') {
    Object.keys(T.days).forEach(key => {
      const v = T.days[key];
      if (!/^(\d{4})-(\d{2})-(\d{2})$/.test(key) || !v || !String(v.n || '').trim()) {
        delete T.days[key]; fixed++;
      }
    });
  }

  /* 消息：时间非法 / 未来 / 重复 id */
  if (Array.isArray(S.messages)) {
    const seen = new Set();
    S.messages = S.messages.filter(msg => {
      if (!msg) { fixed++; return false; }
      const ts = Number(msg.ts);
      if (!isFinite(ts) || ts > now + 60000) { fixed++; return false; }
      if (msg.id && seen.has(msg.id)) { fixed++; return false; }
      if (msg.id) seen.add(msg.id);
      return true;
    });
  }

  /* 动态：id 重复 / 时间非法 / 无效的转发指向 */
  if (Array.isArray(S.posts)) {
    const seen = new Set();
    const ids = new Set(S.posts.map(p => p && p.id));
    S.posts = S.posts.filter(p => {
      if (!p) { fixed++; return false; }
      const ts = Number(p.ts);
      if (!isFinite(ts) || ts > now + 60000) { fixed++; return false; }
      if (p.id && seen.has(p.id)) { fixed++; return false; }
      if (p.id) seen.add(p.id);
      if (p.repostOf && !ids.has(p.repostOf)) { /* 原帖已删：保留，渲染时会显示“原动态已删除” */ }
      return true;
    });
  }

  if (fixed) { try { save(); } catch (e) {} }
  return fixed;
}

function openSectionSheet(mode, data){
  const allKeys = SECTION_DEFS.map(d=>d.k);
  const chosen = new Set(mode === 'in'
    ? (Array.isArray(data && data.sections) ? data.sections.filter(k=>allKeys.includes(k)) : allKeys)
    : allKeys);
  let mergeMode = 'merge';
  const groups = [...new Set(SECTION_DEFS.map(d => d.g))];
  const listHtml = groups.map(g => `
    <div class="sec-grp">${g}</div>
    <div class="sec-card">${SECTION_DEFS.filter(d => d.g === g).map(d => `
      <div class="sec-row" data-k="${d.k}">
        <i class="sec-ck${chosen.has(d.k) ? ' on' : ''}"></i>
        <div class="sec-tx"><b>${d.name}</b><span>${d.desc}</span></div>
        <div class="sec-n">${d.n()}</div>
      </div>`).join('')}</div>`).join('');
  const modeHtml = mode === 'in' ? `
    <div class="sec-mode">
      <button class="on" data-m="merge">合并到现有</button>
      <button data-m="replace">完全覆盖</button>
    </div>` : '';
  openSheet(`
    <div class="sec-head">
      <div><b>${mode === 'out' ? '导出备份' : '导入备份'}</b>
        <span>${mode === 'out' ? '选择要保存的部分，只导出需要的那些' : '选择要导入的部分'}</span></div>
      <div class="sec-pill" data-all><span data-alltxt>取消全选</span></div>
    </div>
    <div class="sec-list">${listHtml}</div>
    ${modeHtml}
    <button class="sec-do" data-do="1">${mode === 'out' ? '导出备份' : '开始导入'}</button>
    <button class="m-row cancel" data-do="0">取消</button>`, el => {
    const list = el.querySelectorAll('.sec-row');
    el.classList.add('sec-sheet');
    const allTxt = el.querySelector('[data-alltxt]');
    const refresh = () => {
      const on = [...list].filter(r => r.querySelector('.sec-ck').classList.contains('on')).length;
      const total = SECTION_DEFS.length;
      allTxt.textContent = on === total ? '取消全选' : '全部选中';
    };
    el.addEventListener('click', async e => {
      const row = e.target.closest('.sec-row');
      if(row){ row.querySelector('.sec-ck').classList.toggle('on'); refresh(); return; }
      if(e.target.closest('[data-all]')){
        const on = [...list].filter(r => r.querySelector('.sec-ck').classList.contains('on')).length;
        const isAll = on === list.length;
        list.forEach(r => r.querySelector('.sec-ck').classList.toggle('on', !isAll));
        refresh(); return;
      }
      const mb = e.target.closest('[data-m]');
      if(mb){
        mergeMode = mb.dataset.m;
        el.querySelectorAll('[data-m]').forEach(b=>b.classList.toggle('on', b === mb));
        return;
      }
      const go = e.target.closest('[data-do]');
      if(!go) return;
      if(go.dataset.do === '0'){ closeSheet(); return; }
      const keys = [...list].filter(r=>r.querySelector('.sec-ck').classList.contains('on')).map(r=>r.dataset.k);
      if(!keys.length){ toast('至少选一个'); return; }
      closeSheet();
      if(mode === 'out') await doExportSections(keys);
      else await doImportSections(data, keys, mergeMode);
    });
    refresh();
  }, 'center');
}

async function doExportSections(keys){
  toast('正在打包…');
  const state = {};
  if(keys.includes('chat')){ state.messages = S.messages; state.lastSeen = S.lastSeen; }
  if(keys.includes('post')) state.posts = S.posts;
  if(keys.includes('deck')){ state.cards = S.cards; state.cats = S.cats; }
  if(keys.includes('stick')) state.stickers = S.stickers;
  if(keys.includes('me')){ state.me = S.me; state.peer = S.peer; state.countdown = S.countdown; }
  if(keys.includes('set')) state.settings = S.settings;
  if(keys.includes('tl')) state.timeline = S.timeline;
  let media = {};
  if(keys.includes('media')){ try{ media = await Media.all(); }catch(e){} }
  const payload = { app:'yann', v:3, at:Date.now(), sections:keys, state, media };
  downloadText(`yann²备份-${stamp()}.json`, JSON.stringify(payload), 'application/json');
  setTimeout(()=>toast('备份已导出'), 400);
}

function mergeById(cur, add){
  const out = Array.isArray(cur) ? cur.slice() : [];
  (add || []).forEach(x=>{
    if(!x) return;
    const i = out.findIndex(y=>y && y.id && x.id && y.id === x.id);
    if(i >= 0) out[i] = x; else out.push(x);
  });
  return out;
}

async function doImportSections(data, keys, mode){
  const inc = (data && data.state) || {};
  /* 聊天 */
  if(keys.includes('chat') && Array.isArray(inc.messages)){
    if(mode === 'replace'){
      S.messages = inc.messages.slice();
      S.lastSeen = inc.lastSeen || 0;
    } else {
      S.messages = mergeById(S.messages, inc.messages).sort((a,b)=>a.ts-b.ts);
      S.lastSeen = Math.max(S.lastSeen || 0, inc.lastSeen || 0);
    }
  }
  /* 动态 */
  if(keys.includes('post') && Array.isArray(inc.posts)){
    if(mode === 'replace'){
      S.posts = inc.posts.slice();
    } else {
      const merged = mergeById(S.posts, inc.posts);
      merged.forEach(p=>{
        const q = (inc.posts || []).find(x=>x.id === p.id);
        if(!q) return;
        p.likes = Math.max(p.likes || 0, q.likes || 0);
        if(Array.isArray(q.comments)) p.comments = mergeById(p.comments || [], q.comments);
      });
      S.posts = merged;
    }
  }
  /* 字卡 */
  if(keys.includes('deck')){
    if(Array.isArray(inc.cards)) S.cards = mode === 'replace' ? inc.cards.slice() : mergeById(S.cards, inc.cards);
    if(Array.isArray(inc.cats)){
      if(mode === 'replace') S.cats = inc.cats.slice();
      else {
        S.cats = Array.isArray(S.cats) ? S.cats : [];
        inc.cats.forEach(c=>{ if(c && !S.cats.some(x=>x.name === c.name)) S.cats.push(c); });
      }
    }
  }
  /* 表情 */
  if(keys.includes('stick') && Array.isArray(inc.stickers)){
    S.stickers = mode === 'replace' ? inc.stickers.slice() : mergeById(S.stickers, inc.stickers);
  }
  /* 资料（没有合并概念，整体覆盖） */
  if(keys.includes('me')){
    if(inc.me) S.me = Object.assign({}, S.me, inc.me);
    if(inc.peer) S.peer = Object.assign({}, S.peer, inc.peer);
    if(inc.countdown) S.countdown = Object.assign({}, S.countdown, inc.countdown);
  }
  /* 设置 */
  if(keys.includes('set') && inc.settings){
    S.settings = Object.assign({}, S.settings, inc.settings);
  }
  /* 时间轴：按天覆盖 */
  if(keys.includes('tl') && inc.timeline){
    if(!S.timeline) S.timeline = { events:{}, presence:{}, days:{} };
    const T = S.timeline;
    if(mode === 'replace'){
      T.events = inc.timeline.events || {};
      T.presence = inc.timeline.presence || {};
      T.days = inc.timeline.days || {};
    } else {
      Object.assign(T.events || (T.events = {}), inc.timeline.events || {});
      Object.assign(T.presence || (T.presence = {}), inc.timeline.presence || {});
      Object.assign(T.days || (T.days = {}), inc.timeline.days || {});
    }
    if(inc.timeline.since) T.since = T.since ? (T.since < inc.timeline.since ? T.since : inc.timeline.since) : inc.timeline.since;
  }
  /* 媒体 */
  if(keys.includes('media') && data.media && typeof data.media === 'object'){
    for(const k in data.media){
      MEDIA[k] = data.media[k];
      try{ await Media.set(k, data.media[k]); }catch(e){}
    }
  }
  save();
  try { sanitizeData(); } catch (e) { }
  try{ applyTheme(); }catch(e){}
  try{ renderHome(); renderChats(); renderData(); armProactive(); armPeerPost(); }catch(e){}
  if(CUR && PAGE_RENDER[CUR]){ try{ PAGE_RENDER[CUR](); }catch(e){} }
  toast(mode === 'replace' ? '已覆盖导入' : '已合并导入');
}

(function boot() {
  S = loadState();

  (S.posts || []).forEach(p => { p.by = (p.by === 'peer') ? 'peer' : 'me'; });
  /* 图片/音效（IndexedDB）推迟到开场动画之后再读，避免和入场动画抢主线程造成卡顿 */

    .then(m => { MEDIA = m || {}; refreshShell(); if (CUR && PAGE_RENDER[CUR]) PAGE_RENDER[CUR](); })
    .catch(() => { MEDIA = {}; });
  if (S.settings.introOn) setTimeout(loadMedia, 2000); else loadMedia();

  applyTheme();

  const hintEl = document.getElementById('msgHint');
  if (hintEl) hintEl.addEventListener('click', () => { hintEl.classList.remove('on'); go('chat'); });
  document.addEventListener('click', e => {
    const r = e.target.closest('[data-rcmt]');
    if (!r) return;
    /* 点对方评论的头像 → 去他主页；自己的头像不跳 */

    openCommentReply(r.dataset.rpost, r.dataset.rcmt);
  });
  bindDeck();
  bindSettings();
  bindData();
  document.addEventListener('click', e => {
    const b = e.target.closest('[data-repmore]');
    if (!b) return;
    const id = b.dataset.repmore;
    if (expandedCmt.has(id)) expandedCmt.delete(id); else expandedCmt.add(id);
    if (CUR === 'peer') renderPeerPanel();
    else if (TAB === 'profile') renderProfilePanel();
  });
  bindCall();

  document.addEventListener('visibilitychange', () => {
    if (document.visibilityState !== 'visible') return;
    /* 从后台回来：清掉可能卡住的遮罩，重绘当前页，避免“点什么都没反应” */
    const intro = document.getElementById('intro');
    if (intro && (intro.classList.contains('done') || performance.now() > 8000)) intro.remove();
    const hint = document.getElementById('msgHint');
    if (hint) hint.classList.remove('on');
    const host = document.getElementById('sheetHost');
    if (host && host.classList.contains('on') && !host.querySelector('.sheet')) {
      host.classList.remove('on');
      host.innerHTML = '';
    }
    /* 通话层的 pointer-events 完全交给 CSS（.call-screen.on 才可点）；
       以前这里写过内联 pointer-events:none，会把之后就来的来电按钮永远锁死 */
    const call = document.getElementById('call');
    if (call && !call.classList.contains('on')) call.style.pointerEvents = '';
    /* 自愈：通话还在（响铃/通话中）但整屏被藏了就重新露出来 */
    const mini = document.getElementById('callMini');
    const inCall = Call.on && (Call.state === 'incoming' || Call.state === 'dialing' || Call.state === 'active');
    if (inCall && call && !call.classList.contains('on') && !(mini && mini.classList.contains('on'))) {
      call.classList.add('on');
    }
    refreshShell();
    updateTabDots();
    if (S.settings.keepAlive) startKeepAlive();
    if (CUR && PAGE_RENDER[CUR]) PAGE_RENDER[CUR]();
  });
  setInterval(() => {
    if (CUR === 'chat' && S.settings.readStateOn) renderMsgs();
  }, 30000);
  window.addEventListener('resize', () => { autoGrow(); });

  /* 先让首帧稳定下来（布局/样式算完）再起动画，避免开场第一帧就抢主线程 */
  requestAnimationFrame(() => setTimeout(playIntro, 40));
  try { const n = sanitizeData(); if (n) console.log('[自检] 修正了', n, '处异常数据'); } catch (e) { }
  armProactive();
  armPeerPost();

  document.addEventListener('pointerdown', () => { try { ac(); } catch (e) { } if (S.settings.keepAlive) startKeepAlive(); }, { once: true });
})();

/* PWA：只在 http(s) 下注册 Service Worker，file:// 直接跳过 */
if ('serviceWorker' in navigator && /^https?:$/.test(location.protocol)) {
  window.addEventListener('load', () => {
    navigator.serviceWorker.register('sw.js').then(reg => { try { reg.update(); } catch (e) { } }).catch(() => { });
  });
  /* 新版本接管后自动刷一次：不用再手动刷新两遍，免得一直跑旧 CSS */
  navigator.serviceWorker.addEventListener('controllerchange', () => {
    if (sessionStorage.getItem('swReloaded') === '1') return;
    sessionStorage.setItem('swReloaded', '1');
    location.reload();
  });
}

<script>
/* ================= 时间轴模块 ================= */
(function(){
  const q = s => document.querySelector(s);
  const pad2 = n => String(n).padStart(2,'0');
  const WD = ['周日','周一','周二','周三','周四','周五','周六'];
  const rnd = (a,b) => a + Math.random()*(b-a);
  const nid = () => 'e'+Date.now().toString(36)+Math.random().toString(36).slice(2,6);
  const MSTAR = '<svg viewBox="0 0 24 24"><path d="M12 3.6l2.6 5.5 6 .8-4.4 4.2 1.1 6-5.3-2.9-5.3 2.9 1.1-6L3.4 9.9l6-.8z"/></svg>';

  const keyOf = ts => { const d = new Date(ts); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); };
  const todayKey = () => keyOf(Date.now());
  const dateOf = key => { const p = key.split('-').map(Number); return new Date(p[0], p[1]-1, p[2]); };
  const hm = ts => { const d = new Date(ts); return pad2(d.getHours())+':'+pad2(d.getMinutes()); };
  const human = key => { const d = dateOf(key); return `${d.getMonth()+1} 月 ${d.getDate()} 日 · ${WD[d.getDay()]}`; };

  function st(){
    if(!S) return null;
    if(!S.timeline) S.timeline = {};
    const T = S.timeline;
    if(!T.events) T.events = {};
    if(!T.presence) T.presence = {};
    if(!T.days) T.days = {};
    if(!T.since){ T.since = todayKey(); try{ save(); }catch(e){} }
    return T;
  }
  const persist = () => { try{ save(); }catch(e){} };

  /* ---------- 生成事件：按活跃时段各自抽 ---------- */
  const SEG = [[480,720,.32],[720,1080,.42],[1080,1320,.52],[1320,1440,.18]];
  const PLING = [.15,.20,.25,.12];
  const POLD = [.02,.03,.04,.03];
  /* 按小时抽：每小时小概率来一下，时间分布才自然，不会抽完一段就停住 */
  const H_START = 8, H_END = 24;
  const P_LOOK_H = 0.10, P_LING_H = 0.05, P_OLD_H = 0.012;
  const BLOCKS = [[8, 12], [12, 16], [16, 20], [20, 24]];
  function ensureEvents(key){
    const T = st(); if(!T) return [];
    if(key < T.since || key > todayKey()){ delete T.events[key]; return []; }
    const isToday = key === todayKey();
    if(!Array.isArray(T.events[key])) T.events[key] = [];
    if(!T.evGen) T.evGen = {};
    const list = T.events[key];
    const base = dateOf(key).getTime();
    const now = new Date();
    const nowMin = isToday ? now.getHours()*60 + now.getMinutes() : 1440;
    /* 已经抽过的小时 */
    let done = Array.isArray(T.evGen[key]) ? T.evGen[key].slice() : null;
    if(!done){
      if(isToday){
        done = [];
        list.forEach(e => {
          const h = Math.floor((e.ts - base) / 60000 / 60);
          if(h >= H_START && h < H_END && !done.includes(h)) done.push(h);
        });
      } else {
        done = [];
        for(let h = H_START; h < H_END; h++) done.push(h);
      }
    }
    let added = false;
    const countType = t => list.filter(e => e.type === t).length;
    for(let h = H_START; h < H_END; h++){
      if(done.includes(h)) continue;
      const s0 = h * 60, s1 = Math.min((h + 1) * 60, nowMin - 1);
      if(s0 >= nowMin) break;
      if(s1 - s0 < 15) continue;
      done.push(h);
      added = true;
      const at = () => base + rnd(s0 + 2, s1 - 1) * 60000;
      if(countType('look') < 4 && Math.random() < P_LOOK_H){
        list.push({id:nid(), type:'look', ts: at()});
      }
      if(countType('linger') < 3 && Math.random() < P_LING_H){
        list.push({id:nid(), type:'linger', ts: at(), mins: Math.round(rnd(2,18)),
          sec: Math.round(rnd(0,59)), where: Math.random() < .65 ? '聊天页' : '动态页'});
      }
      if(countType('old') < 1 && Math.random() < P_OLD_H){
        list.push({id:nid(), type:'old', ts: at(), days: Math.round(rnd(3,20)), screens: Math.round(rnd(3,12))});
      }
    }
    /* 滑动窗口保底：最近 4 小时里一条生成事件都没有 → 补一条，任何时间打开都能看到新动静 */
    if(nowMin > H_START * 60 + 30){
      const from = Math.max(H_START * 60, nowMin - 240);
      const recent = list.some(e => {
        const m = (e.ts - base) / 60000;
        return m >= from && m <= nowMin;
      });
      if(!recent && Math.random() < 0.92){
        const m = rnd(from + 10, Math.max(from + 25, nowMin - 5));
        if(Math.random() < 0.6){
          list.push({id:nid(), type:'look', ts: base + m * 60000});
        } else {
          list.push({id:nid(), type:'linger', ts: base + m * 60000, mins: Math.round(rnd(2,18)),
            sec: Math.round(rnd(0,59)), where: '聊天页'});
        }
        added = true;
      }
    }
    if(added || !Array.isArray(T.evGen[key])){
      T.evGen[key] = done;
      persist();
    }
    /* 清掉可能残留的未来事件（旧逻辑生成过） */
    const nowTs2 = Date.now();
    for(let i = list.length - 1; i >= 0; i--){
      if(list[i].ts > nowTs2) list.splice(i, 1);
    }
    return list;
  }

  /* ---------- 离线表 ---------- */
  function ensurePresence(key){
    const T = st(); if(!T) return [];
    if(key < T.since || key > todayKey()){ delete T.presence[key]; return []; }
    if(T.presence[key]) return T.presence[key];
    const segs = [];
    /* 凌晨 01–07：八成默认离线，整段睡过去 */
    if(Math.random() < 0.8) segs.push([60, 420]);
    const n = 1 + Math.floor(Math.random()*3);
    for(let i=0;i<n;i++){
      const len = Math.round(rnd(20,45));
      const start = Math.round(rnd(500, 1380-len));
      if(segs.some(s => start < s[1]+10 && start+len > s[0]-10)) continue;
      segs.push([start, start+len]);
    }
    T.presence[key] = segs;
    persist();
    return segs;
  }

  /* ---------- 真实事件 ---------- */
  function realEvents(key){
    const out = [];
    const t0 = dateOf(key).getTime();
    const t1 = t0 + 86400000;
    const inDay = ts => ts >= t0 && ts < t1;
    (S.posts||[]).forEach(p => {
      const isPeer = p.by === 'peer';
      const who = isPeer ? 'her' : 'me';
      /* 发帖 / 转发（转发的帖子只算一次） */
      if(inDay(p.ts)){
        out.push({type: p.repostOf ? (isPeer?'repost':'myrepost') : (isPeer?'post':'mypost'),
          who, ts: p.ts, text: p.text||''});
      }
      if(p.liked && p.likedAt && inDay(p.likedAt)) out.push({type:'mylike', who:'me', ts:p.likedAt});
      if(p.saved && p.savedAt && inDay(p.savedAt)) out.push({type:'mysave', who:'me', ts:p.savedAt});
      if(p.peerLikedAt && inDay(p.peerLikedAt)) out.push({type:'peerlike', who:'her', ts:p.peerLikedAt});
      if(p.peerSavedAt && inDay(p.peerSavedAt)) out.push({type:'peersave', who:'her', ts:p.peerSavedAt});
      (p.comments||[]).forEach(c => {
        if(c.ts && inDay(c.ts)) out.push({
          type: c.by === 'peer' ? 'peercomment' : 'mycomment',
          who: c.by === 'peer' ? 'her' : 'me', ts: c.ts, text: c.text || ''
        });
      });
    });
    (S.messages||[]).forEach(m => {
      if(m.role === 'system' && m.ts >= t0 && m.ts < t1){
        out.push({type:'call', who:'sys', ts: m.ts, text: m.text||'通话'});
      }
    });
    return out;
  }

  function presenceEvents(key){
    const segs = ensurePresence(key);
    const base = dateOf(key).getTime();
    const nowTs = Date.now();
    const out = [];
    segs.forEach(seg => {
      const tOff = base + seg[0]*60000, tOn = base + seg[1]*60000;
      /* 只输出已经发生的：离线表可以排到全天，但还没到的时间不能上屏 */
      if(tOff <= nowTs) out.push({ type:'offline', who:'her', dur: seg[1]-seg[0], ts: tOff });
      if(tOn <= nowTs) out.push({ type:'online', who:'her', dur: seg[1]-seg[0], ts: tOn });
    });
    return out;
  }

  function dayRows(key){
    const gen = ensureEvents(key).slice();
    const rows = realEvents(key).concat(gen, presenceEvents(key));
    /* 一律不上屏未来时间的事件 */
    const nowTs = Date.now();
    return rows.filter(e => e.ts <= nowTs).sort((a,b) => b.ts - a.ts);
  }

  /* ---------- 渲染 ---------- */
  /* 前缀名：对方用备注（无备注则昵称），我这边固定写「我」 */
  function peerName(){
    if(typeof peerLabel === 'function') return peerLabel();
    const p = S.peer || {};
    return (p.remark || p.name || '对方').trim() || '对方';
  }
  function myName(){
    return '我';
  }

  function rowHtml(e){
    let cls = 'tl-row';
    if(e.who === 'me') cls += ' mine';
    if(e.who === 'sys') cls += ' sys';
    let nm = '', sub = '';
    switch(e.type){
      case 'look': nm = `${esc(peerName())}看了动态`; sub = '刷了会儿动态页'; break;
      case 'linger': nm = `${esc(peerName())}在${e.where}停留 <b>${e.mins} 分 ${pad2(e.sec)} 秒</b>`; sub = '没有任何操作'; break;
      case 'old': nm = `${esc(peerName())}翻到了 <b>${e.days} 天前</b>的聊天`; sub = `往回翻了 ${e.screens} 屏`; break;
      case 'online': nm = `${esc(peerName())}上线了`; sub = `离线 ${e.dur} 分钟`; break;
      case 'offline': nm = `${esc(peerName())}下线了`; sub = ''; break;
      case 'post': nm = `${esc(peerName())}发了动态`; sub = esc(decodeMentions((e.text||'').slice(0,20))); break;
      case 'mypost': nm = `${esc(myName())}发了动态`; sub = esc(decodeMentions((e.text||'').slice(0,20))); break;
      case 'repost': nm = `${esc(peerName())}转发了你的动态`; sub = ''; break;
      case 'myrepost': nm = `${esc(myName())}转发了一条动态`; sub = ''; break;
      case 'peerlike': nm = `${esc(peerName())}赞了你的动态`; sub = ''; break;
      case 'mylike': nm = `${esc(myName())}赞了一条动态`; sub = ''; break;
      case 'peercomment': nm = `${esc(peerName())}评论了你的动态`; sub = esc((e.text||'').slice(0,20)); break;
      case 'mycomment': nm = `${esc(myName())}评论了一条动态`; sub = esc((e.text||'').slice(0,20)); break;
      case 'peersave': nm = `${esc(peerName())}收藏了你的动态`; sub = ''; break;
      case 'mysave': nm = `${esc(myName())}收藏了一条动态`; sub = ''; break;
      case 'call': nm = esc(e.text || '通话'); sub = ''; break;
      default: nm = '记录'; break;
    }
    return `<div class="${cls}"><div class="tm">${hm(e.ts)}</div><div class="nd"><i></i></div>
      <div class="cn"><div class="nm">${nm}</div>${sub ? `<div class="sub">${sub}</div>` : ''}</div></div>`;
  }

  function whenText(key){
    const diff = Math.round((dateOf(key).getTime() - dateOf(todayKey()).getTime())/86400000);
    if(diff === 0) return '就是今天';
    return diff > 0 ? `还有 ${diff} 天` : `已过 ${-diff} 天`;
  }

  function markRow(v){
    return `<div class="tl-row mark"><div class="tm">这天</div><div class="nd">${MSTAR}</div>
      <div class="cn"><div class="nm"><b>${esc(v.n)}</b></div>
      <div class="sub">${esc([v.note, whenText(v.key)].filter(Boolean).join(' · '))}</div></div></div>`;
  }

  function countOf(key){
    const T = st(); if(!T) return 0;
    if(!T.events[key]) ensureEvents(key);
    return dayRows(key).length;
  }

  function isOnlineNow(){
    const T = st(); if(!T) return true;
    const now = new Date();
    const m = now.getHours()*60 + now.getMinutes();
    return !(T.presence[todayKey()]||[]).some(s => m >= s[0] && m < s[1]);
  }

  /* 聊天页状态：在线 / 离线 N 分钟 / 最后在线 HH:MM */
  function peerState(){
    const T = st(); if(!T) return { online:true, text:'在线' };
    const now = new Date();
    const m = now.getHours()*60 + now.getMinutes();
    const segs = ensurePresence(todayKey());
    const hit = segs.find(s => m >= s[0] && m < s[1]);
    if(!hit) return { online:true, text:'在线' };
    const offMin = Math.max(1, m - hit[0]);
    if(offMin < 60) return { online:false, text:`离线 ${offMin} 分钟` };
    return { online:false, text:`最后在线 ${pad2(Math.floor(hit[0]/60))}:${pad2(hit[0]%60)}` };
  }
  window.tlPeerState = peerState;

  /* 现在立刻上线：把当前离线段的结束时间收到现在 */
  function goOnlineNow(){
    const T = st(); if(!T) return;
    const k = todayKey();
    const now = new Date();
    const m = now.getHours()*60 + now.getMinutes();
    const segs = T.presence[k] || [];
    const hit = segs.find(s => m >= s[0] && m < s[1]);
    if(!hit) return;
    hit[1] = Math.max(hit[0] + 1, m);
    persist();
  }
  window.tlGoOnline = goOnlineNow;

  /* 上线后补齐：把挂着未读的消息标已读，并让对方回一句 */
  function checkHoldReply(){
    const T = st(); if(!T || !T.holdReply) return;
    const s = peerState();
    if(!s.online) return;
    const t0 = T.holdReply;
    delete T.holdReply;
    (S.messages || []).forEach(m => {
      if(m.role === 'me' && m.holdRead){ m.holdRead = false; }
      if(m.role === 'me' && m.ts >= t0 && !m.read){ m.read = true; m.readTs = Date.now(); }
    });
    persist();
    if(typeof CUR !== 'undefined' && CUR === 'chat'){
      try{ renderMsgs(); }catch(e){}
      if(typeof refreshPeerStatus === 'function') refreshPeerStatus();
    }
    setTimeout(() => { try{ triggerReply({}); }catch(e){} }, 900);
  }
  window.tlCheckHold = checkHoldReply;

  setInterval(() => {
    try{
      checkHoldReply();
      if(typeof CUR === 'undefined' || CUR !== 'chat') return;
      if(typeof typing !== 'undefined' && typing) return;
      const el = document.getElementById('peerStatus');
      if(!el) return;
      const s2 = peerState();
      el.textContent = s2.text;
      el.classList.toggle('off', !s2.online);
    }catch(err){}
  }, 30000);

  function prune(){
    const T = st(); if(!T) return;
    const cut = Date.now() - 95*86400000;
    Object.keys(T.events).forEach(k => { if(k < T.since || k > todayKey() || dateOf(k).getTime() < cut) delete T.events[k]; });
    Object.keys(T.presence).forEach(k => { if(k < T.since || k > todayKey() || dateOf(k).getTime() < cut) delete T.presence[k]; });
  }

  function refreshHome(){
    if(!S) return;
    prune();
    const conv = q('#tlConv'); if(!conv) return;
    const list = (S.messages||[]).filter(m => m.role !== 'system');
    const last = list[list.length-1];
    const av = (typeof avatarUrl === 'function') ? avatarUrl(S.peer.avatar) : '';
    const ini = ((typeof peerLabel === 'function' ? peerLabel() : '' ) || '·').trim().slice(0,1);
    const n = (typeof unreadCount === 'function') ? unreadCount() : 0;
    const on = isOnlineNow();
    conv.innerHTML = `<div class="tl-av" style="${av ? `background-image:url('${av}')` : ''}">${av ? '' : esc(ini)}</div>
      <div class="tl-cm"><div class="tl-cn">${esc(typeof peerLabel==='function'?peerLabel():'对方')}<span class="t">${last ? hm(last.ts) : ''}</span></div>
      <div class="tl-cs${on ? '' : ' off'}"><i></i>${on ? '在线' : '离线'}</div></div>
      ${n ? `<span class="row-count">${n > 99 ? '99+' : n}</span>` : ''}`;

    const wk = q('#tlWeek');
    if(wk){
      const now = new Date(); const out = [];
      for(let i=6;i>=0;i--){
        const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()-i);
        const k = keyOf(d);
        out.push(`<div class="tl-wd${k===todayKey() ? ' on' : ''}" data-tlday="${k}"><span>${'日一二三四五六'[d.getDay()]}</span><b>${d.getDate()}</b></div>`);
      }
      wk.innerHTML = out.join('');
    }

    const sb = q('#tlStrip');
    if(sb){
      const now = new Date(); const out = [];
      for(let i=29;i>=0;i--){
        const d = new Date(now.getFullYear(), now.getMonth(), now.getDate()-i);
        const c = countOf(keyOf(d));
        const l = c <= 0 ? 0 : c <= 1 ? 1 : c <= 2 ? 2 : c <= 4 ? 3 : 4;
        out.push(`<i class="${l ? 'l'+l : ''}${i===0 ? ' on' : ''}"></i>`);
      }
      sb.innerHTML = out.join('');
    }

    const tl = q('#tlList');
    if(tl){
      const rows = dayRows(todayKey());
      tl.innerHTML = rows.length ? rows.map(rowHtml).join('') : '<div class="tl-empty">今天还没有记录</div>';
    }
  }

  /* ---------- 某一天 ---------- */
  let dayKey = null;
  function renderDay(key){
    dayKey = key;
    const d = dateOf(key);
    const T = st();
    const v = T.days[key];
    const rows = dayRows(key);
    const box = q('#dayList');
    const parts = [];
    if(v) parts.push(markRow(Object.assign({key}, v)));
    rows.forEach(e => parts.push(rowHtml(e)));
    box.innerHTML = parts.length ? parts.join('') : '<div class="tl-empty">这天没有记录</div>';
    q('#dayTitle').textContent = `${d.getMonth()+1} 月 ${d.getDate()} 日`;
    const isToday = key === todayKey();
    q('#daySub').textContent = `${WD[d.getDay()]}${isToday ? ' · 今天' : ''}`;
    q('#dayStar').classList.toggle('on', !!v);
    const nw = new Date();
    q('#dayPrev').classList.remove('dim');
    q('#dayNext').classList.toggle('dim', key >= todayKey());
    q('#dayScroll').scrollTop = 0;
  }
  function shiftDay(delta){
    if(!dayKey) return;
    const d = dateOf(dayKey);
    d.setDate(d.getDate() + delta);
    const k = keyOf(d);
    if(k > todayKey()) return;
    renderDay(k);
  }

  function openDay(key){
    renderDay(key);
    (typeof go === 'function') ? go('p-day') : q('#p-day').classList.add('open');
  }

  /* ---------- 月历 ---------- */
  let calSel = null, calMonth = null;
  function openCal(){
    const t = new Date();
    calMonth = new Date(t.getFullYear(), t.getMonth(), 1);
    calSel = todayKey();
    buildCal();
    q('#calMask').classList.add('on');
    q('#calSheet').classList.add('on');
  }
  function closeCal(){
    q('#calMask').classList.remove('on');
    q('#calSheet').classList.remove('on');
  }
  function buildCal(){
    const T = st();
    const y = calMonth.getFullYear(), m = calMonth.getMonth();
    const total = new Date(y, m+1, 0).getDate();
    const lead = (new Date(y, m, 1).getDay() + 6) % 7;
    const tk = todayKey();
    let out = '';
    for(let i=0;i<lead;i++) out += '<div class="cal-cell mute"></div>';
    for(let day=1; day<=total; day++){
      const k = keyOf(new Date(y, m, day));
      const c = k > tk ? 0 : countOf(k);
      const l = c <= 0 ? 0 : c <= 1 ? 1 : c <= 2 ? 2 : c <= 4 ? 3 : 4;
      const cls = ['cal-cell', l ? 'l'+l : '', k===tk ? 'today' : '', k===calSel ? 'sel' : ''].filter(Boolean).join(' ');
      const mk = T.days[k] ? `<i class="mk">${MSTAR}</i>` : '';
      out += `<div class="${cls}" data-calday="${k}">${mk}<span>${day}</span></div>`;
    }
    q('#calGrid').innerHTML = out;
    const curY = new Date().getFullYear();
    q('#calTitle').textContent = (y === curY ? '' : y + ' 年 ') + (m + 1) + ' 月';
    q('#calSelTitle').textContent = human(calSel);
    const v = T.days[calSel];
    q('#calSelMeta').textContent = v ? v.n : '';
  }

  function shiftMonth(delta){
    calMonth = new Date(calMonth.getFullYear(), calMonth.getMonth() + delta, 1);
    const now = new Date();
    const isCur = calMonth.getFullYear() === now.getFullYear() && calMonth.getMonth() === now.getMonth();
    calSel = isCur ? todayKey() : keyOf(new Date(calMonth.getFullYear(), calMonth.getMonth(), 1));
    buildCal();
  }

  /* ---------- 重要的日子编辑 ---------- */
  function openDaySheet(){
    const T = st();
    if(!T.days) return;
    const v = T.days[dayKey];
    const sh = q('#daySheet');
    sh.innerHTML = `<div class="sh-h">${human(dayKey)}</div>
      <input type="text" class="in-n" value="${v ? esc(v.n) : ''}" placeholder="这天是什么日子">
      <input type="text" class="in-s" value="${v ? esc(v.note) : ''}" placeholder="备注">
      <div class="sh-b">${v ? '<i class="op del">删除</i>' : ''}<i class="op cancel">取消</i><i class="op save">保存</i></div>`;
    q('#dayMask').classList.add('on');
    sh.classList.add('on');
    const n = sh.querySelector('.in-n'), note = sh.querySelector('.in-s');
    n.focus();
    const done = () => { q('#dayMask').classList.remove('on'); sh.classList.remove('on'); };
    const saveIt = () => {
      const nm = n.value.trim();
      T.days[dayKey] = nm ? {n:nm, note:note.value.trim(), createdDay:todayKey()} : null;
      if(!nm) delete T.days[dayKey];
      persist(); done(); renderDay(dayKey);
    };
    sh.querySelector('.save').addEventListener('click', saveIt);
    sh.querySelector('.cancel').addEventListener('click', done);
    sh.querySelector('.del')?.addEventListener('click', () => { delete T.days[dayKey]; persist(); done(); renderDay(dayKey); });
    [n, note].forEach(inp => inp.addEventListener('keydown', e => { if(e.key === 'Enter') saveIt(); if(e.key === 'Escape') done(); }));
  }

  /* ---------- 当天提醒 ---------- */
  function checkRemind(){
    const T = st(); if(!T) return;
    const k = todayKey(), v = T.days[k];
    if(!v || v.reminded) return;
    if(v.createdDay && v.createdDay >= k) return;
    v.reminded = true; persist();
    setTimeout(() => {
      q('#remName').textContent = v.n;
      q('#remWhen').textContent = human(k);
      q('#remindMask').classList.add('on');
      q('#remindPop').classList.add('on');
    }, 900);
  }
  function closeRemind(){
    q('#remindMask').classList.remove('on');
    q('#remindPop').classList.remove('on');
  }

  /* ---------- 绑定 ---------- */
  document.addEventListener('click', e => {
    if(e.target.closest('#tlConv')){ if(typeof go === 'function') go('chat'); return; }
    const wd = e.target.closest('[data-tlday]');
    if(wd){ openDay(wd.dataset.tlday); return; }
    if(e.target.closest('#calBtn')){ openCal(); return; }
    if(e.target.closest('#calPrev')){ shiftMonth(-1); return; }
    if(e.target.closest('#calNext')){ shiftMonth(1); return; }
    if(e.target.closest('#calClose') || e.target.closest('#calMask')){ closeCal(); return; }
    const cd = e.target.closest('[data-calday]');
    if(cd){ calSel = cd.dataset.calday; buildCal(); return; }
    if(e.target.closest('#calGo')){ const k = calSel; closeCal(); openDay(k); return; }
    if(e.target.closest('#dayStar')){ openDaySheet(); return; }
    if(e.target.closest('#dayPrev')){ shiftDay(-1); return; }
    if(e.target.closest('#dayNext')){ shiftDay(1); return; }
    if(e.target.closest('#remOk') || e.target.closest('#remindMask')){ closeRemind(); return; }
  });

  /* 主页面重绘时同步时间轴 */
  if(typeof renderChats === 'function'){
    const orig = renderChats;
    window.renderChats = function(){
      const r = orig.apply(this, arguments);
      try{ refreshHome(); }catch(err){}
      return r;
    };
  }

  window.tlRefresh = refreshHome;
  window.tlOpenDay = openDay;

  setTimeout(() => {
    try{ refreshHome(); checkRemind(); }catch(err){ console.warn('timeline', err); }
  }, 60);
})();
</script>
